name: Puppet profiles

on:
  push:
    branches: [production, main, dev]
    paths:
      - 'modules/**'
      - 'data/**'
      - 'manifests/**'
      - 'tests/**'
      - 'scripts/autosign.py'
      - 'scripts/external_node_classifier.py'
      - 'scripts/openvox*.py'
      - 'docker/openvox/**'
      - 'proxmox/**'
      - 'provisioning/**'
      - 'docker/docker-compose.yml'
      - 'docker/vault/scripts/0[1-4]-*.sh'
      - 'docker/vault/scripts/offline-intermediate.rb'
      - 'docker/vault/scripts/unseal.sh'
      - 'docker/vault/setup/Dockerfile'
      - 'docker/vault/unsealer/Dockerfile'
      - 'docker/vault/scripts/06-vault-puppet.sh'
      - 'docker/vault/scripts/03-puppet-external-ca.sh'
      - 'docker/vault/scripts/08-vault-puppet-policy.sh'
      - 'docker/vault/scripts/policies/**'
      - 'Puppetfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/puppet.yaml'
  pull_request:
    paths:
      - 'modules/**'
      - 'data/**'
      - 'manifests/**'
      - 'tests/**'
      - 'scripts/autosign.py'
      - 'scripts/external_node_classifier.py'
      - 'scripts/openvox*.py'
      - 'docker/openvox/**'
      - 'proxmox/**'
      - 'provisioning/**'
      - 'docker/docker-compose.yml'
      - 'docker/vault/scripts/0[1-4]-*.sh'
      - 'docker/vault/scripts/offline-intermediate.rb'
      - 'docker/vault/scripts/unseal.sh'
      - 'docker/vault/setup/Dockerfile'
      - 'docker/vault/unsealer/Dockerfile'
      - 'docker/vault/scripts/06-vault-puppet.sh'
      - 'docker/vault/scripts/03-puppet-external-ca.sh'
      - 'docker/vault/scripts/08-vault-puppet-policy.sh'
      - 'docker/vault/scripts/policies/**'
      - 'Puppetfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/puppet.yaml'

permissions:
  contents: read

jobs:
  enrollment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/checkout@v5
        with:
          repository: Enucatl/docker-compose-security-baseline
          ref: 41c57257d33d471e2ae7cc7264938944c67434fd
          path: .ci-compose-baseline
          persist-credentials: false
      - name: Expose pinned sibling Compose baseline
        run: ln -s "$GITHUB_WORKSPACE/.ci-compose-baseline" "$GITHUB_WORKSPACE/../compose-security-baseline"
      - name: Install disposable Vault test runtime
        env:
          VAULT_VERSION: '2.1.0'
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base jq
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip"
          curl -fsSLO "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_SHA256SUMS"
          grep " vault_${VAULT_VERSION}_linux_amd64.zip$" "vault_${VAULT_VERSION}_SHA256SUMS" | sha256sum -c -
          unzip "vault_${VAULT_VERSION}_linux_amd64.zip" vault
          sudo install vault /usr/local/bin/vault
      - name: Check enrollment scripts and single-use authorization
        run: |
          for script in proxmox/*.sh docker/openvox/*.sh docker/openvox/infra-{host-pre-receive,host-post-receive,post-receive} docker/vault/scripts/unseal.sh docker/vault/scripts/{01-pki-core-setup,02-pki-intermediate,03-puppet-external-ca,04-sign-csr,06-vault-puppet,08-vault-puppet-policy}.sh; do bash -n "$script"; done
          uv run --frozen ruff check proxmox/atlas-infra.py scripts/autosign.py scripts/openvox*.py docker/openvox/vault-api.py docker/openvox/infra-pki-self-test.py proxmox/desktop.py proxmox/desktop_cloud_init.py tests/test_autosign*.py tests/test_openvox*.py tests/test_offline_vault*.py tests/test_puppet_enrollment_vault.py tests/test_puppet_pki_vault.py tests/test_vault_unseal_pin.py tests/test_puppet_provisioning.py tests/test_desktop_provisioning.py tests/test_atlas_*.py tests/test_router_dns.py
          uv run --frozen ruff format --check proxmox/atlas-infra.py scripts/autosign.py scripts/openvox*.py docker/openvox/vault-api.py docker/openvox/infra-pki-self-test.py proxmox/desktop.py proxmox/desktop_cloud_init.py tests/test_autosign*.py tests/test_openvox*.py tests/test_offline_vault*.py tests/test_puppet_enrollment_vault.py tests/test_puppet_pki_vault.py tests/test_vault_unseal_pin.py tests/test_puppet_provisioning.py tests/test_desktop_provisioning.py tests/test_atlas_*.py tests/test_router_dns.py
          uv run --frozen python scripts/openvox_rehearsal_recovery.py
          uv run --frozen python -m pytest -q --ignore=tests/test_openvox_child_policy.py tests/test_autosign*.py tests/test_openvox*.py tests/test_offline_vault*.py tests/test_puppet_enrollment_vault.py tests/test_puppet_pki_vault.py tests/test_vault_unseal_pin.py tests/test_puppet_provisioning.py tests/test_atlas_*.py tests/test_router_dns.py
  profiles:
    runs-on: ubuntu-24.04
    env:
      PUPPET_TEST_MODULEPATH: /tmp/openvox-ci-modules
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/checkout@v5
        with:
          repository: Enucatl/docker-compose-security-baseline
          ref: 41c57257d33d471e2ae7cc7264938944c67434fd
          path: .ci-compose-baseline
          persist-credentials: false
      - name: Expose pinned sibling Compose baseline
        run: ln -s "$GITHUB_WORKSPACE/.ci-compose-baseline" "$GITHUB_WORKSPACE/../compose-security-baseline"
      - name: Install the accepted Ubuntu 24.04 OpenVox test runtime
        env:
          OPENVOX_RELEASE_URL: https://github.com/Enucatl/openvox-packages/releases/download/resolute-24001
          OPENVOX_AGENT_VERSION: 9.1.0+homelab.24001-1+ubuntu24.04
        run: |
          test "$(. /etc/os-release; printf '%s' "$VERSION_ID")" = 24.04
          test "$(dpkg --print-architecture)" = amd64
          curl -fsSLo "$RUNNER_TEMP/openvox-archive-keyring.asc" https://raw.githubusercontent.com/Enucatl/openvox-packages/4f719cb678cc06a6f8c57a2e4a6a6915b84413c9/openvox-archive-keyring.asc
          test "$(gpg --show-keys --with-colons "$RUNNER_TEMP/openvox-archive-keyring.asc" | awk -F: '$1 == "pub" { primary = 1; next } primary && $1 == "fpr" { print $10; primary = 0 }')" = 775661C709ACE6F7C1CF0FF6C4B7528F03E0BB94
          sudo install -d -m 0755 /etc/apt/keyrings
          sudo install -m 0644 "$RUNNER_TEMP/openvox-archive-keyring.asc" /etc/apt/keyrings/openvox-archive-keyring.asc
          curl -fsSLo "$RUNNER_TEMP/openvox.pref" "$OPENVOX_RELEASE_URL/ubuntu24.04.pref"
          sudo install -m 0644 "$RUNNER_TEMP/openvox.pref" /etc/apt/preferences.d/openvox-homelab
          printf 'deb [arch=amd64 signed-by=/etc/apt/keyrings/openvox-archive-keyring.asc] %s/ ./\n' "$OPENVOX_RELEASE_URL" | sudo tee /etc/apt/sources.list.d/openvox-homelab.list >/dev/null
          sudo apt-get update
          sudo apt-get install -y "openvox-agent=$OPENVOX_AGENT_VERSION"
          test "$(dpkg-query -W -f='${Version}' openvox-agent)" = "$OPENVOX_AGENT_VERSION"
          sudo systemctl stop puppet
          /opt/puppetlabs/puppet/bin/ruby -ropenssl -e 'key = OpenSSL::PKey.generate_key("ML-DSA-44"); abort unless key.verify(nil, key.sign(nil, "ci"), "ci")'
      - name: Install pinned modules for catalog checks
        run: |
          sudo /opt/puppetlabs/puppet/bin/gem install --no-document r10k --version 5.0.3
          /opt/puppetlabs/puppet/bin/r10k puppetfile install --puppetfile Puppetfile --moduledir "$PUPPET_TEST_MODULEPATH"
          test -d "$PUPPET_TEST_MODULEPATH/stdlib"
          test -d "$PUPPET_TEST_MODULEPATH/systemd"
      - name: Validate Puppet, EPP and rehearsal syntax
        run: |
          /opt/puppetlabs/bin/puppet parser validate modules/profile/manifests modules/proxmox_workflows/manifests
          /opt/puppetlabs/bin/puppet parser validate docker/openvox/fixture/manifests
          rg --files modules/profile/templates -g '*.epp' -0 | xargs -0 /opt/puppetlabs/bin/puppet epp validate
          for script in docker/openvox/*.rb docker/vault/scripts/offline-intermediate.rb; do /opt/puppetlabs/puppet/bin/ruby -c "$script"; done
      - name: Test catalogs and workflows with dummy secrets
        run: >-
          uv run --frozen python -m pytest -q
          tests/test_proxmox_orchestration.py tests/test_chronicle_backup_orchestrator.py
          tests/test_vllm_weekly_window.py
          tests/test_openvox_child_policy.py tests/test_desktop_provisioning.py
