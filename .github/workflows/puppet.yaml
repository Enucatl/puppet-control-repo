name: Puppet profiles

on:
  push:
    branches: [production, main]
    paths:
      - 'modules/**'
      - 'data/**'
      - 'manifests/**'
      - 'tests/**'
      - 'scripts/autosign.py'
      - 'proxmox/**'
      - 'docker/vault/scripts/06-vault-puppet.sh'
      - 'docker/vault/scripts/03-puppet-external-ca.sh'
      - 'docker/vault/scripts/08-vault-puppet-policy.sh'
      - 'Puppetfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/puppet.yaml'
  pull_request:
    paths:
      - 'modules/**'
      - 'data/**'
      - 'manifests/**'
      - 'tests/**'
      - 'scripts/autosign.py'
      - 'proxmox/**'
      - 'docker/vault/scripts/06-vault-puppet.sh'
      - 'docker/vault/scripts/03-puppet-external-ca.sh'
      - 'docker/vault/scripts/08-vault-puppet-policy.sh'
      - 'Puppetfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/puppet.yaml'

permissions:
  contents: read

jobs:
  enrollment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Install disposable Vault test runtime
        env:
          VAULT_VERSION: '2.1.0'
        run: |
          sudo apt-get update
          sudo apt-get install -y gettext-base jq
          cd "$RUNNER_TEMP"
          curl -fsSLO "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_linux_amd64.zip"
          curl -fsSLO "https://releases.hashicorp.com/vault/${VAULT_VERSION}/vault_${VAULT_VERSION}_SHA256SUMS"
          grep " vault_${VAULT_VERSION}_linux_amd64.zip$" "vault_${VAULT_VERSION}_SHA256SUMS" | sha256sum -c -
          unzip "vault_${VAULT_VERSION}_linux_amd64.zip" vault
          sudo install vault /usr/local/bin/vault
      - name: Check enrollment scripts and single-use authorization
        run: |
          for script in proxmox/*.sh docker/vault/scripts/{03-puppet-external-ca,06-vault-puppet,08-vault-puppet-policy}.sh; do bash -n "$script"; done
          uv run --frozen ruff check scripts/autosign.py proxmox/desktop.py proxmox/desktop_cloud_init.py tests/test_autosign.py tests/test_puppet_enrollment_vault.py tests/test_puppet_pki_vault.py tests/test_puppet_provisioning.py tests/test_desktop_provisioning.py
          uv run --frozen ruff format --check scripts/autosign.py proxmox/desktop.py proxmox/desktop_cloud_init.py tests/test_autosign.py tests/test_puppet_enrollment_vault.py tests/test_puppet_pki_vault.py tests/test_puppet_provisioning.py tests/test_desktop_provisioning.py
          uv run --frozen pytest -q tests/test_autosign.py tests/test_puppet_enrollment_vault.py tests/test_puppet_pki_vault.py tests/test_puppet_provisioning.py tests/test_desktop_provisioning.py
  profiles:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
      - name: Install the public Puppet 8 test runtime
        run: |
          curl -fsSLo /tmp/puppet8-release.deb https://apt.puppet.com/puppet8-release-noble.deb
          sudo dpkg -i /tmp/puppet8-release.deb
          sudo apt-get update
          sudo apt-get install -y puppet-agent=8.10.0-1noble
          sudo systemctl stop puppet
      - name: Validate Puppet and EPP syntax
        run: |
          /opt/puppetlabs/bin/puppet parser validate modules/profile/manifests modules/proxmox_workflows/manifests
          rg --files modules/profile/templates -g '*.epp' -0 | xargs -0 /opt/puppetlabs/bin/puppet epp validate
      - name: Test catalogs and workflows with dummy secrets
        run: >-
          uv run --frozen pytest -q
          tests/test_cursor_version.py
          tests/test_proxmox_orchestration.py tests/test_chronicle_backup_orchestrator.py
          tests/test_vllm_weekly_window.py
