name: Puppet profiles

on:
  push:
    branches: [production, main, dev]
    paths:
      - 'modules/**'
      - 'data/**'
      - 'manifests/**'
      - 'tests/**'
      - 'scripts/**'
      - '.githooks/**'
      - 'docker/**'
      - 'proxmox/**'
      - 'provisioning/**'
      - 'compose*.yaml'
      - 'hiera.yaml'
      - 'Puppetfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/puppet.yaml'
  pull_request:
    paths:
      - 'modules/**'
      - 'data/**'
      - 'manifests/**'
      - 'tests/**'
      - 'scripts/**'
      - '.githooks/**'
      - 'docker/**'
      - 'proxmox/**'
      - 'provisioning/**'
      - 'compose*.yaml'
      - 'hiera.yaml'
      - 'Puppetfile'
      - 'pyproject.toml'
      - 'uv.lock'
      - '.github/workflows/puppet.yaml'

permissions:
  contents: read

env:
  UV_PYTHON: '3.14'

jobs:
  enrollment:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/checkout@v5
        with:
          repository: Enucatl/docker-compose-security-baseline
          ref: 41c57257d33d471e2ae7cc7264938944c67434fd
          path: .ci-compose-baseline
          persist-credentials: false
      - name: Expose pinned sibling Compose baseline
        run: ln -s "$GITHUB_WORKSPACE/.ci-compose-baseline" "$GITHUB_WORKSPACE/../compose-security-baseline"
      - name: Run enrollment checks
        run: scripts/ci/enrollment.sh
  profiles:
    runs-on: ubuntu-24.04
    env:
      PUPPET_TEST_MODULEPATH: /tmp/openvox-ci-modules
    steps:
      - uses: actions/checkout@v5
      - uses: astral-sh/setup-uv@v9.0.0
      - uses: actions/checkout@v5
        with:
          repository: Enucatl/docker-compose-security-baseline
          ref: 41c57257d33d471e2ae7cc7264938944c67434fd
          path: .ci-compose-baseline
          persist-credentials: false
      - name: Expose pinned sibling Compose baseline
        run: ln -s "$GITHUB_WORKSPACE/.ci-compose-baseline" "$GITHUB_WORKSPACE/../compose-security-baseline"
      - name: Run profiles checks
        run: scripts/ci/profiles.sh
