---
# Historical migration/rollback only; normal provisioning never loads these.
# --- ADGUARD (DNS only; DHCP handled by dnsmasq) ---
# All segments point DNS to 10.0.0.1 / {ula_prefix}::1
# (AdGuard on router via host networking).
# IOT-LOCAL and GUEST-LOCAL firewall chains allow port 53 inbound to router.
# AdGuard forwards home.arpa queries to dnsmasq for local hostname resolution.
adguard_data_path: "/config/containers/adguard"
adguard_dns_bind_hosts:
  - "{{ vyos_lan_ip | ansible.utils.ipaddr('address') }}"
  - "{{ ula_prefix }}::1"
adguard_image: "docker.io/adguard/adguardhome:latest"

# --- DNSMASQ (DHCPv4 + authoritative DNS for home.arpa) ---
# Runs as a container on VyOS with host networking.
# DNS on port 5300 to avoid conflict with AdGuard on port 53.
# Only resolves hostnames for addresses it has assigned via DHCP (IPv4 only).
dnsmasq_image: "docker.io/andyshinn/dnsmasq:latest"
dnsmasq_data_path: "/config/containers/dnsmasq"
dnsmasq_dns_port: "5300"
