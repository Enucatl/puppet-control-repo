---
# Apply optional delete commands first, then the desired VyOS set commands.
# Keeping deletes in a separate commit avoids VyOS validating delete/recreate
# operations for the same node in one transaction.

- name: Render VyOS delete config locally
  delegate_to: localhost
  check_mode: no
  ansible.builtin.template:
    src: templates/partials/deletes.j2
    dest: /tmp/vyos-deletes.rendered
    mode: "0600"
  tags: [vyos_config]

- name: Check whether delete configuration is needed
  delegate_to: localhost
  check_mode: no
  ansible.builtin.command:
    cmd: grep -q '[^[:space:]]' /tmp/vyos-deletes.rendered
  register: vyos_deletes_needed
  changed_when: false
  failed_when: false
  tags: [vyos_config]

- name: Apply VyOS delete configuration
  vyos.vyos.vyos_config:
    src: /tmp/vyos-deletes.rendered
  when: vyos_deletes_needed.rc == 0
  tags: [vyos_config]

# Apply the full VyOS configuration via set commands.
# Template is rendered locally first (vyos_config src: does not process Jinja2),
# then handed to vyos_config which sends each line as a configure-mode command,
# commits, and saves. backup: yes saves the pre-change running config first.

- name: Render VyOS config locally
  delegate_to: localhost
  check_mode: no
  ansible.builtin.template:
    src: templates/vyos-config.j2
    dest: /tmp/vyos-config.rendered
    mode: "0600"
  tags: [vyos_config]

- name: Apply VyOS configuration
  vyos.vyos.vyos_config:
    src: /tmp/vyos-config.rendered
    save: yes
    backup: yes
  tags: [apply_commit, vyos_config]

- name: Remove rendered config from local
  delegate_to: localhost
  check_mode: no
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/vyos-deletes.rendered
    - /tmp/vyos-config.rendered
  tags: [vyos_config]
