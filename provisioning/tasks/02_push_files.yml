---
# Template all app configs locally, push them to VyOS, and install them to
# persistent storage in one pass. Using a loop eliminates the repeated
# template → upload → install → cleanup pattern from the old playbook.

# ============================================================
# STEP 1: Template all files locally to /tmp/
# ============================================================
- name: Stage the system CA bundle for router log shipping
  delegate_to: localhost
  ansible.builtin.copy:
    src: /etc/ssl/certs/ca-certificates.crt
    dest: /tmp/ca-certificates.crt
    mode: "0600"

- name: Template app configs locally
  delegate_to: localhost
  ansible.builtin.template:
    src: "templates/app_configs/{{ item.src }}"
    dest: "/tmp/{{ item.dest }}"
    mode: "0600"
  loop:
    - { src: "alloy-vyos.alloy.j2",        dest: "config.alloy" }
    - { src: "vyos-ndp-snapshot.sh.j2",    dest: "vyos-ndp-snapshot.sh" }
    - { src: "vyos-ndp-logrotate.j2",      dest: "vyos-ndp-logrotate" }
    - { src: "suricata-update.sh.j2",      dest: "suricata-update.sh" }
    - { src: "suricata-disable.conf.j2",   dest: "suricata-disable.conf" }
    - { src: "suricata-logrotate.j2",      dest: "suricata-logrotate" }
    - { src: "suricata-systemd-override.conf.j2", dest: "suricata-systemd-override.conf" }
    - { src: "router-smoke-check.sh.j2",    dest: "router-smoke-check.sh" }

# ============================================================
# STEP 2: Upload all files to /tmp/ on VyOS
# ============================================================
- name: Upload app configs to VyOS
  ansible.netcommon.net_put:
    src: "/tmp/{{ item }}"
    dest: "/tmp/{{ item }}"
  loop:
    - config.alloy
    - ca-certificates.crt
    - vyos-ndp-snapshot.sh
    - vyos-ndp-logrotate
    - suricata-update.sh
    - suricata-disable.conf
    - suricata-logrotate
    - suricata-systemd-override.conf
    - router-smoke-check.sh

# ============================================================
# STEP 3: Install each file to its persistent destination
# ============================================================
- name: Install Alloy config
  vyos.vyos.vyos_command:
    commands:
      - sudo mv /tmp/config.alloy {{ alloy_data_path }}/conf/config.alloy
      - sudo chown root:vyattacfg {{ alloy_data_path }}/conf/config.alloy
      - sudo chmod 0644 {{ alloy_data_path }}/conf/config.alloy
      - sudo install -o root -g vyattacfg -m 0644 /tmp/ca-certificates.crt {{ alloy_data_path }}/conf/ca-certificates.crt
      - rm /tmp/ca-certificates.crt

- name: Install VyOS NDP snapshot script
  vyos.vyos.vyos_command:
    commands:
      - sudo mv /tmp/vyos-ndp-snapshot.sh /config/scripts/vyos-ndp-snapshot.sh
      - sudo chmod 0755 /config/scripts/vyos-ndp-snapshot.sh

- name: Install VyOS NDP logrotate config
  vyos.vyos.vyos_command:
    commands:
      - sudo mv /tmp/vyos-ndp-logrotate /config/logrotate.d/vyos-ndp
      - sudo chmod 0644 /config/logrotate.d/vyos-ndp

- name: Install Suricata update script
  vyos.vyos.vyos_command:
    commands:
      - sudo mv /tmp/suricata-update.sh /config/scripts/suricata-update.sh
      - sudo chmod 0755 /config/scripts/suricata-update.sh

- name: Install Suricata disable config
  vyos.vyos.vyos_command:
    commands:
      - sudo mv /tmp/suricata-disable.conf /config/suricata/disable.conf
      - sudo chmod 0644 /config/suricata/disable.conf

- name: Install Suricata logrotate config
  vyos.vyos.vyos_command:
    commands:
      - sudo mv /tmp/suricata-logrotate /config/logrotate.d/suricata
      - sudo chmod 0644 /config/logrotate.d/suricata

- name: Install Suricata systemd override
  vyos.vyos.vyos_command:
    commands:
      - sudo mv /tmp/suricata-systemd-override.conf /etc/systemd/system/suricata.service.d/20-memorymax.conf
      - sudo chown root:root /etc/systemd/system/suricata.service.d/20-memorymax.conf
      - sudo chmod 0644 /etc/systemd/system/suricata.service.d/20-memorymax.conf
      - sudo systemctl daemon-reload

- name: Install router smoke check script
  vyos.vyos.vyos_command:
    commands:
      - sudo mv /tmp/router-smoke-check.sh /config/scripts/router-smoke-check.sh
      - sudo chmod 0755 /config/scripts/router-smoke-check.sh

# ============================================================
# STEP 4: Clean up local temporary files
# ============================================================
- name: Clean up local temporary files
  delegate_to: localhost
  ansible.builtin.file:
    path: "/tmp/{{ item }}"
    state: absent
  loop:
    - config.alloy
    - ca-certificates.crt
    - vyos-ndp-snapshot.sh
    - vyos-ndp-logrotate
    - suricata-update.sh
    - suricata-disable.conf
    - suricata-logrotate
    - suricata-systemd-override.conf
    - router-smoke-check.sh
