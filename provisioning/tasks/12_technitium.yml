---
- name: Require initialized Technitium data before ordinary provisioning
  vyos.vyos.vyos_command:
    commands:
      - >-
        sudo -n test -s {{ technitium_data_path }}/dns.config &&
        sudo -n test -s {{ technitium_data_path }}/admin-password && echo TECHNITIUM_INITIALIZED
    wait_for:
      - result[0] contains 'TECHNITIUM_INITIALIZED'
    retries: 1

- name: Install Technitium utility and configuration
  ansible.builtin.import_tasks: tasks/technitium_install.yml

- name: Manage Technitium service
  ansible.builtin.import_tasks: tasks/technitium_service.yml

- name: Refresh Technitium DNS while preserving DHCP scopes and reservations
  vyos.vyos.vyos_command:
    commands:
      - >-
        sudo -n /usr/bin/python3 /config/scripts/technitium.py configure /config/scripts/technitium.json &&
        echo TECHNITIUM_CONFIGURED
    wait_for:
      - result[0] contains 'TECHNITIUM_CONFIGURED'
    retries: 1
  vars:
    ansible_command_timeout: 300
