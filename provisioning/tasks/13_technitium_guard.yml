---
- name: Require the retired legacy DNS mode to remain disabled
  ansible.builtin.assert:
    that: technitium_active | default(false) | bool
    fail_msg: "Normal provisioning requires active Technitium. Use the saved migration tools and historical revision for rollback."

- name: Require repository DNS mode to match the completed cutover
  vyos.vyos.vyos_command:
    commands:
      - >-
        sudo -n test {{ '-f' if technitium_active | default(false) else '!' ~ ' -f' }}
        {{ technitium_data_path }}-candidate/cutover-active && echo TECHNITIUM_MODE_MATCHES
    wait_for:
      - result[0] contains 'TECHNITIUM_MODE_MATCHES'
    retries: 1
  changed_when: false
