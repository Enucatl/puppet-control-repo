---
- name: Load Technitium declarations for migration
  ansible.builtin.include_vars: vars/technitium.yml

- name: Render migration script
  delegate_to: localhost
  ansible.builtin.template:
    src: templates/app_configs/technitium-cutover.sh.j2
    dest: /tmp/technitium-cutover.sh
    mode: "0600"

- name: Render resolved DHCP declarations
  delegate_to: localhost
  ansible.builtin.copy:
    content: "{{ technitium_dhcp_scopes | to_json }}"
    dest: /tmp/technitium-scopes.json
    mode: "0600"

- name: Render static DNS ownership for lease validation
  delegate_to: localhost
  ansible.builtin.copy:
    content: "{{ technitium_dns_hosts | to_json }}"
    dest: /tmp/technitium-hosts.json
    mode: "0600"

- name: Upload migration assets
  ansible.netcommon.net_put:
    src: "{{ item.src }}"
    dest: "/tmp/{{ item.name }}"
  loop:
    - {src: /tmp/technitium-cutover.sh, name: technitium-cutover.sh}
    - {src: /tmp/technitium-scopes.json, name: technitium-scopes.json}
    - {src: /tmp/technitium-hosts.json, name: technitium-hosts.json}
    - {src: "{{ playbook_dir }}/files/technitium-leases.py", name: technitium-leases.py}

- name: Install migration assets
  vyos.vyos.vyos_command:
    commands:
      - >-
        sudo -n install -o root -g root -m 0700 /tmp/technitium-cutover.sh /config/scripts/technitium-cutover.sh &&
        sudo -n install -o root -g root -m 0700 /tmp/technitium-leases.py /config/scripts/technitium-leases.py &&
        sudo -n install -o root -g root -m 0600 /tmp/technitium-scopes.json /config/scripts/technitium-scopes.json &&
        sudo -n install -o root -g root -m 0600 /tmp/technitium-hosts.json /config/scripts/technitium-hosts.json &&
        rm /tmp/technitium-cutover.sh /tmp/technitium-leases.py /tmp/technitium-scopes.json /tmp/technitium-hosts.json && echo TECHNITIUM_MIGRATION_INSTALLED
    wait_for:
      - result[0] contains 'TECHNITIUM_MIGRATION_INSTALLED'
    retries: 1

- name: Remove local migration renders
  delegate_to: localhost
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /tmp/technitium-cutover.sh
    - /tmp/technitium-scopes.json
    - /tmp/technitium-hosts.json

- name: Validate current leases before scheduling any service interruption
  vyos.vyos.vyos_command:
    commands:
      - >-
        sudo -n python3 /config/scripts/technitium-leases.py
        --scopes /config/scripts/technitium-scopes.json
        --hosts /config/scripts/technitium-hosts.json
        --dnsmasq {{ dnsmasq_data_path }}/leases/dnsmasq.leases >/dev/null && echo TECHNITIUM_LEASE_PREFLIGHT_OK
    wait_for:
      - result[0] contains 'TECHNITIUM_LEASE_PREFLIGHT_OK'
    retries: 1
  changed_when: false
