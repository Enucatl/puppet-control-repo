---
# Create all persistent directories on VyOS before anything is deployed.
# These live under /config/ so they survive reboots.

- name: Create AdGuard data directories
  vyos.vyos.vyos_command:
    commands:
      - mkdir -p {{ adguard_data_path }}/work
      - mkdir -p {{ adguard_data_path }}/conf

- name: Create dnsmasq data directories
  vyos.vyos.vyos_command:
    commands:
      - mkdir -p {{ dnsmasq_data_path }}/conf
      - mkdir -p {{ dnsmasq_data_path }}/leases
      - mkdir -p {{ dnsmasq_data_path }}/log

- name: Create Alloy data directories
  vyos.vyos.vyos_command:
    commands:
      - mkdir -p {{ alloy_data_path }}/conf
      - mkdir -p {{ alloy_data_path }}/data

- name: Create Suricata config directory
  vyos.vyos.vyos_command:
    commands:
      - mkdir -p /config/suricata

- name: Create scripts directory
  vyos.vyos.vyos_command:
    commands:
      - mkdir -p /config/scripts

- name: Create logrotate config directory
  vyos.vyos.vyos_command:
    commands:
      - mkdir -p /config/logrotate.d

- name: Create active systemd override directory for Suricata
  vyos.vyos.vyos_command:
    commands:
      - sudo mkdir -p /etc/systemd/system/suricata.service.d
