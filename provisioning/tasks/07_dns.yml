---
# DNS-only updates avoid applying unrelated firewall or route changes.
- name: Update active Technitium DNS
  ansible.builtin.import_tasks: tasks/12_technitium.yml
- name: Render DNS smoke checks locally
  delegate_to: localhost
  ansible.builtin.template:
    src: "templates/app_configs/{{ item }}.j2"
    dest: "/tmp/{{ item }}"
    mode: "0600"
  loop:
    - router-smoke-check.sh

- name: Upload updated DNS smoke checks
  ansible.netcommon.net_put:
    src: /tmp/router-smoke-check.sh
    dest: /tmp/router-smoke-check.sh

- name: Install smoke checks
  vyos.vyos.vyos_command:
    commands:
      - >-
        sudo -n install -o root -g vyattacfg -m 0755 /tmp/router-smoke-check.sh /config/scripts/router-smoke-check.sh &&
        rm -f /tmp/router-smoke-check.sh

- name: Remove local rendered files
  delegate_to: localhost
  ansible.builtin.file:
    path: "/tmp/{{ item }}"
    state: absent
  loop:
    - router-smoke-check.sh
