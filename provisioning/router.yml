---
- name: Configure VyOS Router
  hosts: router
  gather_facts: no

  vars:
    # --- SECRETS (from HashiCorp Vault kv/puppet) ---
    _vault_kv_puppet: "{{ lookup('community.hashi_vault.vault_kv2_get', 'puppet', engine_mount_point='kv').secret }}"
    ipv6_prefix: "{{ _vault_kv_puppet['ipv6-prefix'] }}"
    snmp_v3_password: "{{ _vault_kv_puppet['snmp_v3_password'] }}"
    wg_server_private_key: "{{ _vault_kv_puppet['wg_server_private_key'] }}"
    cloudflare_api_token: "{{ _vault_kv_puppet['cloudflare_api_token'] }}"

  pre_tasks:
    - name: Verify secrets were retrieved from Vault
      ansible.builtin.assert:
        that:
          - ipv6_prefix | length > 0
          - snmp_v3_password | length > 0
          - wg_server_private_key | length > 0
          - cloudflare_api_token | length > 0
        fail_msg: "Failed to retrieve secrets from HashiCorp Vault (kv/puppet)"

  tasks:
    - name: Initialize a fresh Technitium installation
      ansible.builtin.import_tasks: tasks/technitium_bootstrap.yml
      tags: [technitium-bootstrap, never]

    - name: Integrate active Technitium logs without a full router apply
      ansible.builtin.import_tasks: tasks/15_technitium_monitoring.yml
      tags: [technitium-monitoring, never]

    - name: Upgrade VyOS to the latest signed rolling image
      ansible.builtin.import_tasks: tasks/06_upgrade_vyos.yml
      tags: [upgrade, never]

    - name: Update DNS and DHCP only
      ansible.builtin.import_tasks: tasks/07_dns.yml
      tags: [dns, never]

    - name: Move only I2P forwarding to Atlas
      ansible.builtin.import_tasks: tasks/08_i2p.yml
      tags: [i2p, never]

    - name: Move only TeamSpeak forwarding to Atlas
      ansible.builtin.import_tasks: tasks/09_teamspeak.yml
      tags: [teamspeak, never]

    - name: Move only qBittorrent forwarding to Atlas
      ansible.builtin.import_tasks: tasks/10_qbittorrent.yml
      tags: [qbittorrent, never]

    - name: Move only NetFlow collection to Atlas
      ansible.builtin.import_tasks: tasks/11_netflow.yml
      tags: [netflow, never]

    - name: Prepare file system and persistent directories
      ansible.builtin.import_tasks: tasks/01_setup_dirs.yml
      tags: [apply]

    - name: Template and upload application configs and scripts
      ansible.builtin.import_tasks: tasks/02_push_files.yml
      tags: [apply]

    - name: Pre-pull container images
      ansible.builtin.import_tasks: tasks/03_pull_images.yml
      tags: [apply]

    - name: Configure Technitium DNS
      ansible.builtin.import_tasks: tasks/12_technitium.yml
      tags: [apply, technitium]

    - name: Diff config against running (load + compare, no commit)
      ansible.builtin.import_tasks: tasks/diff_vyos.yml
      tags: [diff, never]

    - name: Apply declarative VyOS configuration
      ansible.builtin.import_tasks: tasks/04_apply_vyos.yml
      tags: [apply, vyos_config]

    - name: Update Suricata signatures and restart to apply new ruleset
      vyos.vyos.vyos_command:
        commands:
          - sudo /config/scripts/suricata-update.sh
      vars:
        ansible_command_timeout: 300
      tags: [apply]

    - name: Restart Alloy container
      vyos.vyos.vyos_command:
        commands:
          - restart container alloy
      tags: [apply]

    - name: Run router smoke checks
      ansible.builtin.import_tasks: tasks/05_healthcheck.yml
      tags: [apply, healthcheck]
