name: wolf

services:
  wolf:
    extends:
      file: /opt/docker/puppet-control-repo/docker/docker-compose.yml
      service: wolf
    profiles: !reset []
    image: infra-wolf:atlas
    container_name: infra-wolf-1
    labels:
      traefik.http.routers.wolf.rule: 'Host(`wolf.atlas.home.arpa`)'

networks:
  traefik_proxy: {external: true, name: traefik_proxy}

volumes:
  wolf_state: {external: true, name: infra_wolf_state}

secrets:
  wolf_cert:
    file: /opt/docker/puppet-control-repo/docker/wolf/secrets/fullchain.pem
  wolf_key:
    file: /opt/docker/puppet-control-repo/docker/wolf/secrets/key.pem
  wolf_dropbear_key:
    file: /opt/docker/puppet-control-repo/docker/wolf/secrets/dropbear_key
  wolf_dropbear_known_hosts:
    file: /opt/docker/puppet-control-repo/docker/wolf/secrets/dropbear_known_hosts
  wolf_proxmox_api_ca:
    file: /opt/docker/puppet-control-repo/docker/wolf/proxmox-cortex-pve-root-ca.pem
