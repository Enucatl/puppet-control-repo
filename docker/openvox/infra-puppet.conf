[main]
key_type = mldsa44
certname = openvox.home.arpa
server = openvox.home.arpa
ssldir = /etc/puppetlabs/puppet/ssl
cadir = /etc/puppetlabs/puppetserver/ca
codedir = /etc/puppetlabs/code
environmentpath = /etc/puppetlabs/code/environments
hostcert = /etc/puppetlabs/puppet/ssl/certs/openvox.home.arpa.pem

[server]
vardir = /opt/puppetlabs/server/data/puppetserver/server_data
logdir = /var/log/puppetlabs/puppetserver
rundir = /run/puppetlabs/puppetserver
autosign = /helpers/autosign.py
node_terminus = exec
external_nodes = /helpers/external_node_classifier.py
environment_timeout = unlimited
# Imported host leaves use ca_ttl; fresh issuer must outlive this interval.
ca_ttl = 60d

[agent]
certificate_revocation = leaf
hostcert_renewal_interval = 30d
vardir = /opt/puppetlabs/server/data/puppetserver/server_data/agent
