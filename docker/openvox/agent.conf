[main]
key_type = mldsa44
certname = rehearsal.home.arpa
server = openvox.rehearsal.test
ca_server = openvox.rehearsal.test
ssldir = /agent/ssl
vardir = /agent/cache
publicdir = /agent/public
logdir = /agent/log
rundir = /agent/run
localcacert = /agent/ssl/certs/ca.pem

[agent]
environment = production
report = true
runinterval = 30s
waitforcert = 0
