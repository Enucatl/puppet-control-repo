# Manual Vault cutover only; never included by the OpenVox profile implicitly.
# Paths resolve relative to the first Compose file (docker/docker-compose.yml).
services:
  vault:
    image: hashicorp/vault@sha256:e0acd3c681bdf57f002d7214e5d050b876e1704678005c6b0406dd96a65be919
    command: [vault, server, -config=/vault/config/infra-vault.hcl]
    environment:
      VAULT_ADDR: https://hcv.home.arpa:8200
      VAULT_CACERT: /certificates/ca.crt
    volumes: !override
      - vault_data:/vault/file
      - vault_logs:/vault/logs
      - certificates:/certificates:ro
      - type: bind
        source: ./openvox/infra-vault.hcl
        target: /vault/config/infra-vault.hcl
        read_only: true
        bind: {create_host_path: false}

  vault-unsealer:
    environment:
      VAULT_ADDR: https://hcv.home.arpa:8200
      VAULT_PINNED_PUBKEY: /public/vault.pub.pem
    volumes:
      - type: volume
        source: certificates
        target: /public
        read_only: true
        volume: {subpath: public}
    healthcheck:
      test: [CMD, /scripts/unseal.sh, --healthcheck]
