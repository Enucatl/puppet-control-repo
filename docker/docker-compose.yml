name: infra

x-vault-runtime: &vault-runtime
  image: hashicorp/vault:latest
  extends:
    file: ../../compose-security-baseline/hardening.yml
    service: hardened-large
  user: 100:100

x-vault-setup: &vault-setup
  <<: *vault-runtime
  build:
    context: ./vault/setup
  image: infra-vault-setup
  tmpfs:
    - /tmp:rw,noexec,nosuid,size=16m,uid=100,gid=100,mode=0700

services:

  # Explicit opt-in only; identity volumes must already have been restored/imported.
  openvox:
    profiles: [openvox]
    extends:
      file: ../../compose-security-baseline/hardening.yml
      service: hardened-xlarge
    build:
      context: ./openvox
      dockerfile: infra.Dockerfile
    image: infra-openvox:24001
    hostname: openvox.home.arpa
    user: "999:999"
    command: [bash, /infra/infra-start.sh]
    stop_grace_period: 60s
    environment:
      OPENSSL_CONF: /infra/openssl.cnf
      VAULT_ADDR: https://vault.home.arpa:8200
      VAULT_CACERT: /trust/root.pem
      NO_PROXY: vault.home.arpa,openvox.home.arpa,127.0.0.1,localhost
      no_proxy: vault.home.arpa,openvox.home.arpa,127.0.0.1,localhost
      JAVA_ARGS: >-
        -Xms256m -Xmx1024m -XX:ActiveProcessorCount=2
        -Djava.security.properties=/opt/puppetlabs/server/data/puppetserver/java.security.mldsa
        -Djdk.tls.namedGroups=X25519MLKEM768
        -Djdk.tls.client.protocols=TLSv1.3
        -Djdk.tls.server.protocols=TLSv1.3
        -Djdk.tls.client.SignatureSchemes=mldsa44
        -Djdk.tls.server.SignatureSchemes=mldsa44
        -Dorg.bouncycastle.jsse.client.SignatureSchemesCert=mldsa44
        -Dorg.bouncycastle.jsse.server.SignatureSchemesCert=mldsa44
    ports:
      - "8140:8140"
    networks:
      - infra
    tmpfs:
      # JRuby extracts its native POSIX library here; dlopen needs executable mappings.
      - /tmp:rw,exec,nosuid,nodev,size=256m,uid=999,gid=999
      - /run/puppetlabs/puppetserver:rw,noexec,nosuid,size=16m,uid=999,gid=999
      - /var/log/puppetlabs/puppetserver:rw,noexec,nosuid,size=64m,uid=999,gid=999
    volumes:
      - type: bind
        source: ./openvox
        target: /infra
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ../scripts
        target: /helpers
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./openvox/infra-puppet.conf
        target: /etc/puppetlabs/puppet/puppet.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./openvox/infra-webserver.conf
        target: /etc/puppetlabs/puppetserver/conf.d/webserver.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./openvox/ca.conf
        target: /etc/puppetlabs/puppetserver/conf.d/ca.conf
        read_only: true
        bind: {create_host_path: false}
      - type: bind
        source: ./openvox/infra-runtime.conf
        target: /etc/puppetlabs/puppetserver/conf.d/infra-runtime.conf
        read_only: true
        bind: {create_host_path: false}
      - openvox_ssl:/etc/puppetlabs/puppet/ssl
      - openvox_ca:/etc/puppetlabs/puppetserver/ca
      - type: volume
        source: openvox_code
        target: /etc/puppetlabs/code
        volume: {nocopy: true}
      - openvox_data:/opt/puppetlabs/server/data/puppetserver/server_data
      - openvox_gems:/opt/puppetlabs/server/data/puppetserver/jruby-gems
      - openvox_git:/git
      - type: bind
        source: /opt/git/openvox/control.git
        target: /git/control.git
        read_only: true
        bind: {create_host_path: false}
      - openvox_r10k_cache:/var/cache/r10k
      - openvox_trust:/trust:ro
    healthcheck:
      test: [CMD, /opt/puppetlabs/puppet/bin/ruby, /infra/infra-ready.rb]
      interval: 15s
      timeout: 10s
      retries: 12
      start_period: 90s

  goflow2:
    extends:
      file: ../../compose-security-baseline/hardening.yml
      service: hardened-small
    image: netsampler/goflow2:latest
    cpu_shares: 512
    mem_limit: 1g
    memswap_limit: 1g
    ports:
      - "2055:2055/udp"
    command:
      - -listen
      - netflow://:2055
    networks:
      - infra
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/__health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  vault:
    <<: *vault-runtime
    cpu_shares: 1536
    ports:
      - "8200:8200"
    volumes:
      - vault_data:/vault/file
      - vault_logs:/vault/logs
      - ./vault/config:/vault/config
      - certificates:/certificates
    environment:
      - VAULT_LOG_LEVEL=info
      - VAULT_ADDR
      - VAULT_CACERT=/certificates/ca.crt
      - SKIP_CHOWN=true
      - SKIP_SETCAP=true
    networks:
      - infra
    command: vault server -config /vault/config/vault-conf.hcl
    healthcheck:
      test: ["CMD-SHELL", "vault status -format=json >/dev/null 2>&1 || [ \"$$?\" -eq 2 ]"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

  vault-unsealer:
    extends:
      file: ../../compose-security-baseline/hardening.yml
      service: hardened-small
    build:
      context: ./vault/unsealer
      dockerfile: Dockerfile
    image: infra-vault-unsealer
    user: 100:100
    depends_on:
      vault:
        condition: service_started
    environment:
      - CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
      - UNSEAL_KEY_FILE=/unseal/key
      - VAULT_ADDR
    volumes:
      - ./vault/scripts/unseal.sh:/scripts/unseal.sh:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - vault_unseal:/unseal:ro
    command: /scripts/unseal.sh
    networks:
      - infra
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "curl -sf --max-time 5 \"$$VAULT_ADDR/v1/sys/health\" | jq -e '.initialized == true and .sealed == false' >/dev/null",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 60s

  freeipa:
    # no hardening on the docker image, it has to run privileged
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 512
    restart: unless-stopped
    image: freeipa/freeipa-server:almalinux-10
    container_name: freeipa
    hostname: freeipa.home.arpa
    cpu_shares: 1536
    networks:
      - infra
      - traefik_proxy
    ports:
      - "88:88"
      - "88:88/udp"
      - "389:389"
      - "464:464"
      - "464:464/udp"
      - "636:636"
    environment:
      # first run this to generate the CSR
      #- IPA_SERVER_INSTALL_OPTS=--unattended --realm HOME.ARPA --domain home.arpa --external-ca
      - IPA_SERVER_INSTALL_OPTS=--external_cert_file=/data/ipa.crt --external_ca_file=/data/ca.crt
    volumes:
      - freeipa_data:/data
      - ./freeipa/tune-homelab.sh:/opt/freeipa-homelab/tune-homelab.sh:ro
      - ./freeipa/homelab-tuning.conf:/etc/systemd/system/ipa.service.d/homelab-tuning.conf:ro
    sysctls:
      - net.ipv6.conf.all.disable_ipv6=0
      - net.ipv6.conf.all.forwarding=1
    healthcheck:
      test: ["CMD-SHELL", "systemctl is-active --quiet ipa.service && echo | openssl s_client -connect localhost:443 -servername freeipa.home.arpa 2>/dev/null | grep -q 'Verify return code: 0'"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 120s
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.tcp.routers.freeipa-secure.entrypoints=https"
      - "traefik.tcp.routers.freeipa-secure.rule=HostSNI(`freeipa.home.arpa`)"
      - "traefik.tcp.routers.freeipa-secure.tls=true"
      - "traefik.tcp.routers.freeipa-secure.tls.passthrough=true"
      - "traefik.tcp.services.freeipa-secure.loadbalancer.server.port=443"

  apt-cacher-ng:
    extends:
      file: ../../compose-security-baseline/hardening.yml
      service: hardened-small
    build:
      context: ./apt-cacher-ng
      dockerfile: Dockerfile
    ports:
      - 3142:3142
    tmpfs: !reset
      - /tmp:rw,noexec,nosuid,size=32m
      - /run:rw,noexec,nosuid,size=16m
      - /run/apt-cacher-ng:rw,noexec,nosuid,size=16m,uid=101,gid=101
    volumes:
      - /scratch/apt-cacher-ng:/var/cache/apt-cacher-ng
      - ./vault/scripts/acng.conf:/etc/apt-cacher-ng/acng.conf:ro
    networks:
      - apt_cache

  wolf:
    extends:
      file: ../../compose-security-baseline/hardening.yml
      service: hardened-small
    build:
      context: ./wolf
      dockerfile: Dockerfile
    cpu_shares: 512
    tmpfs:
      - /tmp:rw,noexec,nosuid,size=32m
      - /run:rw,noexec,nosuid,size=16m,uid=1000,gid=1000
    environment:
      - VAULT_ADDR=https://hcv.home.arpa:8200
      - VAULT_CACERT=/etc/ssl/certs/ca-certificates.crt
      - WOLF_ALLOWED_GROUP=admins,wolf-operators
      - WOLF_MAX_SESSION_SECONDS=14400
      - WOLF_DROPBEAR_KEY=/run/secrets/wolf_dropbear_key
      - WOLF_DROPBEAR_KNOWN_HOSTS=/run/secrets/wolf_dropbear_known_hosts
      - WOLF_PROXMOX_API_CACERT=/run/secrets/wolf_proxmox_api_ca
      - WOLF_STATE_FILE=/state/session.json
      - WOLF_TRUSTED_PROXY_HOSTS=traefik
      - WOLF_VAULT_API_TOKEN_FIELD=proxmox-cortex-api-token
      - WOLF_VAULT_CERT_ROLE=wolf
      - WOLF_VAULT_CLIENT_CERT=/run/secrets/wolf_cert
      - WOLF_VAULT_CLIENT_KEY=/run/secrets/wolf_key
      - WOLF_VAULT_FIELD=proxmox-cortex
      - WOLF_VAULT_PATH=kv/wolf
    volumes:
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - wolf_state:/state
    secrets:
      - wolf_dropbear_key
      - wolf_dropbear_known_hosts
      - wolf_proxmox_api_ca
      - wolf_cert
      - wolf_key
    networks:
      - traefik_proxy
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=traefik_proxy"
      - "traefik.http.routers.wolf.rule=Host(`wolf.${DOCKER_DOMAIN}`)"
      - "traefik.http.routers.wolf.entrypoints=https"
      - "traefik.http.routers.wolf.tls=true"
      - "traefik.http.routers.wolf.middlewares=authelia@docker,secured@file"
      - "traefik.http.routers.wolf.service=wolf"
      - "traefik.http.services.wolf.loadbalancer.server.port=8000"

  # TEMPORARY CONTAINERS
  # only to document one-off setup

  vault-init:
    extends:
      file: ../../compose-security-baseline/hardening.yml
      service: hardened-small
    profiles: [init]
    image: infra-vault-unsealer
    user: 100:100
    restart: no
    depends_on:
      vault:
        condition: service_healthy
    environment:
      - VAULT_ADDR
      - CURL_CA_BUNDLE=/etc/ssl/certs/ca-certificates.crt
    volumes:
      - ./vault/scripts/00-vault-init.sh:/scripts/00-vault-init.sh:ro
      - /etc/ssl/certs/ca-certificates.crt:/etc/ssl/certs/ca-certificates.crt:ro
      - vault_recovery:/recovery
      - vault_bootstrap:/bootstrap
      - vault_unseal:/unseal
    networks:
      - infra
    command: /scripts/00-vault-init.sh

  # Bootstrap uses this to generate certificates before switching to HTTPS.
  vault-pki-core-setup:
    <<: *vault-setup
    profiles:
      - setup
    restart: no
    depends_on:
      vault-unsealer:
        condition: service_healthy
    environment:
      - VAULT_ADDR
      - ROOT_TOKEN_FILE=/bootstrap/root-token
    volumes:
      - ./vault/scripts:/scripts
      - certificates:/certificates
      - vault_bootstrap:/bootstrap:ro
    networks:
      - infra
    entrypoint: /scripts/01-pki-core-setup.sh

  vault-pki-intermediate-setup:
    <<: *vault-setup
    profiles:
      - setup
    restart: no
    depends_on:
      vault-unsealer:
        condition: service_healthy
    environment:
      - ROOT_TOKEN_FILE=/bootstrap/root-token
      - VAULT_ADDR
      - VAULT_CACERT=/certificates/ca.crt
    volumes:
      - ./vault/scripts:/scripts
      - certificates:/certificates
      - vault_bootstrap:/bootstrap:ro
    entrypoint: /scripts/02-pki-intermediate.sh
    networks:
      - infra

  freeipa-sign-csr:
    <<: *vault-setup
    # FreeIPA's existing /data volume is owned by root.
    user: 0:0
    # Read the UID 100 bootstrap token while retaining the other capability drops.
    cap_add:
      - DAC_READ_SEARCH
    profiles:
      - setup
    restart: no
    depends_on:
      vault-unsealer:
        condition: service_healthy
    environment:
      - ROOT_TOKEN_FILE=/bootstrap/root-token
      - VAULT_ADDR
      - VAULT_CACERT=/certificates/ca.crt
    volumes:
      - ./vault/scripts:/scripts
      - freeipa_data:/data
      - certificates:/certificates
      - vault_bootstrap:/bootstrap:ro
    entrypoint: /scripts/04-sign-csr.sh
    networks:
      - infra

networks:
  apt_cache:
    enable_ipv6: true
  authelia_proxy:
    name: authelia_proxy
    enable_ipv6: true
    attachable: true
  infra:
    name: infra
    enable_ipv6: true
    ipam:
      driver: default
  traefik_proxy:
    name: traefik_proxy
    enable_ipv6: true
    attachable: true
    ipam:
      driver: default

volumes:
  # External names prevent ordinary startup from creating an empty replacement.
  openvox_ssl: {external: true, name: infra_openvox_ssl}
  openvox_ca: {external: true, name: infra_openvox_ca}
  openvox_code: {external: true, name: infra_openvox_code}
  openvox_data: {external: true, name: infra_openvox_data}
  openvox_gems: {external: true, name: infra_openvox_gems}
  openvox_git: {external: true, name: infra_openvox_git}
  openvox_r10k_cache: {external: true, name: infra_openvox_r10k_cache}
  openvox_trust: {external: true, name: infra_openvox_trust}
  # config/state files are kept in the repo checkout via bind mounts
  certificates:
  freeipa_data:
  vault_data:
  vault_recovery:
  vault_bootstrap:
  vault_unseal:
  vault_logs:
  wolf_state:

secrets:
  wolf_cert:
    file: ./wolf/secrets/fullchain.pem
  wolf_key:
    file: ./wolf/secrets/key.pem
  wolf_dropbear_key:
    file: ./wolf/secrets/dropbear_key
  wolf_dropbear_known_hosts:
    file: ./wolf/secrets/dropbear_known_hosts
  wolf_proxmox_api_ca:
    file: ./wolf/proxmox-cortex-pve-root-ca.pem
