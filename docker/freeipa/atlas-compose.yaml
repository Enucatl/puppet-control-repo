name: infra

services:
  ipa:
    build:
      context: .
      dockerfile: atlas.Dockerfile
    image: infra-freeipa:mldsa44
    hostname: ipa.home.arpa
    runtime: sysbox-runc
    restart: unless-stopped
    mem_limit: 2g
    memswap_limit: 2g
    pids_limit: 512
    stop_grace_period: 60s
    environment:
      IPA_SERVER_IP: no-update
    ports:
      - "80:80"
      - "443:443"
      - "88:88"
      - "88:88/udp"
      - "389:389"
      - "464:464"
      - "464:464/udp"
      - "636:636"
    networks:
      infra:
        aliases: [ipa.home.arpa]
    volumes:
      - ipa_data:/data
      - type: bind
        source: /root/openvox-infra/freeipa/container-inputs
        target: /bootstrap
        read_only: true
        bind: {create_host_path: false}
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          systemctl is-active --quiet ipa.service &&
          ! systemctl is-active --quiet pki-tomcatd@pki-tomcat.service &&
          curl --silent --fail --max-time 5 --cacert /bootstrap/root.pem
          --resolve ipa.home.arpa:443:127.0.0.1 https://ipa.home.arpa/ipa/ui/
          > /dev/null
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 300s

networks:
  infra: {external: true, name: infra}

volumes:
  ipa_data: {external: true, name: infra_ipa_data}
