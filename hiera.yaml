---
version: 5

defaults:
  datadir: "data"
  data_hash: yaml_data

hierarchy:
  - name: "Secrets from Vault"
    data_hash: vault_hiera_hash
    uris:
      - "https://hcv.home.arpa:8200/v1/kv/data/puppet"
    options:
      timeout: 20
      version: "v2"
      auth_path: "cert"
      auth_name: "puppet-server"
      ca_trust: "/trust/root.pem"
      crl: "/trust/outbound-crls.pem"
      fail_hard: true

  - name: "Authenticated certificate identity"
    path: "nodes/%{trusted.certname}.yaml"

  - name: "Node Group"
    path: "roles/nodes/%{trusted.certname}.yaml"

  - name: "osfamily/major release"
    paths:
        # Used to distinguish between Debian and Ubuntu
      - "os/%{facts.os.family}/%{facts.os.name}.yaml"

  - name: "OS family"
    path: "os/%{facts.os.family}.yaml"

  - name: "Common data for all nodes"
    path: "common.yaml"
