---
version: 5

defaults:
  datadir: "data"
  data_hash: yaml_data

hierarchy:
  - name: "Secrets from Vault"
    data_hash: vault_hiera_hash
    uris:
      - "https://hcv.home.arpa:8200/v1/kv/data/puppet"
    options:
      timeout: 20
      version: "v2"
      auth_path: "cert"
      ca_trust: "/usr/local/share/ca-certificates/ipa-ca/CN=Docker_Home_Arpa_Root_CA_634702368810934143245700742467692493878270055232.pem"

  - name: "Single node hostname only"
    path: "nodes/%{trusted.hostname}.yaml"

  - name: "Node Group"
    path: "roles/%{facts.node_type}.yaml"

  - name: "osfamily/major release"
    paths:
        # Used to distinguish between Debian and Ubuntu
      - "os/%{facts.os.family}/%{facts.os.name}.yaml"

  - name: "OS family"
    path: "os/%{facts.os.family}.yaml"

  - name: "Common data for all nodes"
    path: "common.yaml"
