# Builder resolves the unique hardware serial and validates this path before rendering.
sources:
  - file:///var/tmp/ubuntu-root.tar.xz
install:
  target: /target
  log_file: /var/log/curtin/install.log
debconf_selections:
  grub: |
    grub-efi-amd64 grub2/force_efi_extra_removable boolean true
kernel:
  package: linux-generic
swap:
  size: 0
grub:
  update_nvram: false
  reorder_uefi: false
storage:
  version: 1
  config:
    - {id: target, type: disk, path: __TARGET_DISK__, ptable: gpt, wipe: superblock, grub_device: true}
    - {id: esp, type: partition, device: target, number: 1, size: 512M, flag: boot}
    - {id: boot, type: partition, device: target, number: 2, size: 1G}
    - {id: root, type: partition, device: target, number: 3, size: 10G}
    - {id: esp-fs, type: format, volume: esp, fstype: fat32}
    - {id: boot-fs, type: format, volume: boot, fstype: ext4}
    - id: root-fs
      type: format
      volume: root
      fstype: xfs
      extra_options: ['-m', 'reflink=1', '-n', 'ftype=1']
    - {id: root-mount, type: mount, device: root-fs, path: /, options: noatime}
    - {id: boot-mount, type: mount, device: boot-fs, path: /boot}
    - {id: esp-mount, type: mount, device: esp-fs, path: /boot/efi}
late_commands:
  10-tools: [curtin, in-target, --, apt-get, install, -y, cloud-init, cloud-guest-utils, qemu-guest-agent, xfsprogs]
  15-efi-fallback: [curtin, in-target, --, test, -s, /boot/efi/EFI/BOOT/BOOTX64.EFI]
  # Let NoCloud configure each clone rather than retaining builder networking.
  20-network: [curtin, in-target, --, sh, -c, 'rm -f /etc/netplan/* /etc/cloud/cloud.cfg.d/50-curtin-networking.cfg']
