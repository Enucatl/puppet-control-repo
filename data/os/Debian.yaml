classes:
  - apt
  - nfs
  - nfs_config
  - packages
  - tidy
  - unattended_upgrades

packages::list:
  - atool
  - auto-apt-proxy
  - expect
  - git
  - ncdu
  - python-is-python3
  - python3
  - python3-docker
  - python3-pip
  - python3-venv
  - rake
  - vault
  - wakeonlan
  - wireguard-tools

fail2ban::config_file_template: "fail2ban_configuration/jail.conf.epp"

nfs::nfs_v4: true
nfs::nfs_v4_idmap_domain: 'home.arpa'
nfs::nfs_v4_mount_root: '/export'
nfs::nfs_v4_idmap_conf: true
nfs::server_enabled: true
nfs::client_enabled: true
nfs::nfs_v4_client_services_enable: true
nfs::nfs_v4_idmap_conf: true

packages::sources:
  hashicorp:
    comment: "HashiCorp Stable Repository"
    location: "https://apt.releases.hashicorp.com"
    release: "%{facts.os.distro.codename}"
    repos: "main"
    architecture: "%{facts.os.architecture}"
    key:
      name: "hashicorp-archive-keyring.asc"
      source: "https://apt.releases.hashicorp.com/gpg"

tidy::files:
  downloads:
    path: /home/user/Downloads

unattended_upgrades::origins:
  - "origin=*"
unattended_upgrades::age:
  max: 14
unattended_upgrades::auto:
  fix_interrupted_dpkg: true
  remove: true
  reboot: false
  reboot_time: "02:00"
unattended_upgrades::update: 1
unattended_upgrades::upgrade: 1
unattended_upgrades::remove_new_unused_deps: true
unattended_upgrades::remove_unused_kernel: true
unattended_upgrades::syslog_enable: true
