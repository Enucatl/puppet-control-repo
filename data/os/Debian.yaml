classes:
  - apt
  - neovim
  - nfs
  - nfs_config
  - packages
  - tidy
  - unattended_upgrades

packages::list:
  - atool
  - auto-apt-proxy
  - bubblewrap
  - expect
  - git
  - git-delta
  - jq
  - kitty-terminfo
  - ncdu
  - python-is-python3
  - python3
  - python3-docker
  - python3-pip
  - python3-venv
  - rake
  - ripgrep
  - vault
  - wakeonlan
  - wireguard-tools

fail2ban::config_file_template: "fail2ban_configuration/jail.conf.epp"

nfs::nfs_v4: true
nfs::nfs_v4_client: true
nfs::nfs_v4_idmap_domain: 'home.arpa'
nfs::nfs_v4_mount_root: '/export'
nfs::nfs_v4_idmap_conf: true
nfs::client_nfsv4_options: 'tcp,nolock,rsize=32768,wsize=32768,intr,noatime,actimeo=3,sec=krb5p'
# FreeIPA manages the Kerberos NFS client daemon; keep the nfs module from owning it.
nfs::client_need_gssd: false
nfs::client_gssd_service: false
nfs::server_enabled: true
nfs::client_enabled: true
nfs::nfs_v4_client_services_enable: true
nfs::nfs_v4_idmap_conf: true

packages::sources:
  hashicorp:
    comment: "HashiCorp Stable Repository"
    source_format: "sources"
    location: "https://apt.releases.hashicorp.com"
    release: "%{facts.os.distro.codename}"
    repos: "main"
    architecture: "%{facts.os.architecture}"
    key:
      name: "hashicorp-archive-keyring.asc"
      source: "https://apt.releases.hashicorp.com/gpg"

profile::common::cron::jobs:
  # Prune stale uv cache entries for the primary interactive user.
  uv-cache-prune:
    minute: 30
    hour: 4
    user: user
    command: 'HOME=/home/user /home/user/.local/bin/uv cache prune 2>&1 | /usr/bin/logger -t uv-cache-prune -p user.info'

tidy::files:
  downloads:
    path: /home/user/Downloads

unattended_upgrades::origins:
  - "origin=*"
unattended_upgrades::age:
  max: 14
unattended_upgrades::auto:
  fix_interrupted_dpkg: true
  remove: true
  reboot: false
  reboot_time: "02:00"
unattended_upgrades::update: 1
unattended_upgrades::upgrade: 1
unattended_upgrades::remove_new_unused_deps: true
unattended_upgrades::remove_unused_kernel: true
unattended_upgrades::syslog_enable: true
