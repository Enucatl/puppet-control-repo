---
classes:
  - profile::docker_host
  - nfs_config
  - profile::user_toolchain
  - profile::codex_mtls

profile::user_toolchain::npm_globals:
  - '@mermaid-js/mermaid-cli'
  - '@openai/codex'

profile::common::certs::vault_certs:
  codex:
    cert_chain_file: /home/user/.config/home-arpa/mtls/codex.crt
    cert_chain_mode: '0644'
    key_file: /home/user/.config/home-arpa/mtls/codex.key
    cert_data:
      common_name: "codex.%{facts.networking.fqdn}"
      alt_names: "codex.%{facts.networking.fqdn}"

freeipa_users::user_groups:
  user:
    - docker

kmod::list_of_loads:
  'br_netfilter': {}

packages::sources:
  docker:
    comment: 'Official Docker Repository'
    location: 'https://download.docker.com/linux/ubuntu'
    release: "%{facts.os.distro.codename}"
    repos: 'stable'
    key:
      id: '9DC858229FC7DD38854AE2D88D81803C0EBFCD88'
      source: 'https://download.docker.com/linux/ubuntu/gpg'
      ensure: absent
  github-cli:
    comment: 'Official GitHub CLI Repository'
    location: 'https://cli.github.com/packages'
    release: 'stable'
    repos: 'main'
    key:
      name: 'githubcli-archive-keyring.gpg'
      source: 'https://cli.github.com/packages/githubcli-archive-keyring.gpg'

packages::list:
  - acl
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - ffmpeg
  - gh
  - parallel
  - python3-docker

profile::alloy::enable_docker: true

profile::common::cron::jobs:
  # Remove unused Docker images, containers, networks, and build cache.
  # --all: removes all unused images (not just dangling ones)
  # --force: skips the confirmation prompt
  # --filter until=Nh: only removes objects not used in the last N hours,
  #   giving recently-pulled but not-yet-started containers a grace period.
  # Volumes are intentionally excluded (no --volumes flag) to avoid data loss.
  docker-prune:
    minute: 0
    hour: 3
    user: root
    command: '/usr/bin/docker system prune --all --force --filter until=24h 2>&1 | /usr/bin/logger -t docker-prune -p user.info'

profile::common::sysctl::settings:
  net.ipv6.conf.all.accept_redirects:
    value: 0
  net.ipv6.conf.default.accept_redirects:
    value: 0
  net.ipv6.conf.all.forwarding:
    value: 1
  net.ipv6.conf.default.forwarding:
    value: 1
  net.ipv6.conf.all.accept_ra:
    value: 2
  net.ipv6.conf.default.accept_ra:
    value: 2
  net.ipv6.conf.all.proxy_ndp:
    value: 1
  net.ipv6.conf.default.proxy_ndp:
    value: 1

promtail::scrape_configs_hash:
  scrape_configs:
    - job_name: docker
      docker_sd_configs:
        - host: unix:///var/run/docker.sock
          refresh_interval: 5s
      relabel_configs:
        - source_labels:
            - "__meta_docker_container_name"
          regex: "/(.*)"
          target_label: 'container_name'
