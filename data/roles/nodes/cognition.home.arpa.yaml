---
classes:
  - nfs_config
  - profile::codex_mtls
  - profile::docker_host
  - profile::user_toolchain
  - profile::codex_plugins

profile::user_toolchain::npm_globals:
  - '@openai/codex'
  - '@anthropic-ai/claude-code'

profile::common::certs::vault_certs:
  codex:
    cert_chain_file: /home/user/.config/home-arpa/mtls/codex.crt
    cert_chain_mode: '0644'
    key_file: /home/user/.config/home-arpa/mtls/codex.key
    key_owner: user
    key_group: user
    key_mode: '0600'
    cert_data:
      common_name: "codex.%{facts.networking.fqdn}"
      alt_names: "codex.%{facts.networking.fqdn}"

freeipa_users::user_groups:
  user:
    - docker
  beszel:
    - docker

kmod::list_of_loads:
  'br_netfilter': {}

packages::sources:
  docker:
    comment: 'Official Docker Repository'
    location: 'https://download.docker.com/linux/ubuntu'
    release: "%{facts.os.distro.codename}"
    repos: 'stable'
    key:
      name: 'docker.asc'
      source: 'https://download.docker.com/linux/ubuntu/gpg'
      ensure: present
  github-cli:
    comment: 'Official GitHub CLI Repository'
    location: 'https://cli.github.com/packages'
    release: 'stable'
    repos: 'main'
    key:
      name: 'githubcli-archive-keyring.gpg'
      source: 'https://cli.github.com/packages/githubcli-archive-keyring.gpg'

packages::list:
  - acl
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - ffmpeg
  - gh
  - parallel
  - python3-docker
  - terraform

profile::alloy::enable_docker: true
profile::alloy::manage_docker_user: true
profile::alloy::manage_geoip: true

profile::common::systemd::units:
  docker-prune.service:
    content: |
      [Unit]
      Description=Prune unused Docker objects
      Wants=network-online.target docker.service
      After=network-online.target docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c '/usr/bin/docker system prune --all --force --filter until=24h 2>&1 | /usr/bin/logger -t docker-prune -p user.info'
      StandardOutput=journal
      StandardError=journal
    enable: false
    active: false
  docker-prune.timer:
    content: |
      [Unit]
      Description=Run Docker cleanup daily

      [Timer]
      OnCalendar=*-*-* 03:00:00 UTC
      Persistent=true
      Unit=docker-prune.service

      [Install]
      WantedBy=timers.target
    enable: true
    active: true
    require: Systemd::Unit_file[docker-prune.service]

profile::common::sysctl::settings:
  net.ipv6.conf.all.accept_redirects:
    value: 0
  net.ipv6.conf.default.accept_redirects:
    value: 0
  net.ipv6.conf.all.forwarding:
    value: 1
  net.ipv6.conf.default.forwarding:
    value: 1
  net.ipv6.conf.all.accept_ra:
    value: 2
  net.ipv6.conf.default.accept_ra:
    value: 2
  net.ipv6.conf.all.proxy_ndp:
    value: 1
  net.ipv6.conf.default.proxy_ndp:
    value: 1
  net.ipv4.conf.all.bc_forwarding:
    value: 1
  net.ipv4.conf.default.bc_forwarding:
    value: 1
  net.ipv4.conf.eth0.bc_forwarding:
    value: 1

promtail::scrape_configs_hash:
  scrape_configs:
    - job_name: docker
      docker_sd_configs:
        - host: unix:///var/run/docker.sock
          refresh_interval: 5s
      relabel_configs:
        - source_labels:
            - "__meta_docker_container_name"
          regex: "/(.*)"
          target_label: 'container_name'
