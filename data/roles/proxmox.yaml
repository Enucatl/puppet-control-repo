packages::list:
  - lm-sensors
  - linux-cpupower
  - nvme-cli
  - powertop

profile::dotfiles::username: root

profile::common::services::resources:
  rpc-svcgssd:
    ensure: stopped
    enable: mask

ssh::server_options:
  PermitRootLogin: prohibit-password

ssh::client_options:
  KnownHostsCommand: '/usr/bin/sss_ssh_knownhosts %h'
