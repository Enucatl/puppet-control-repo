packages::list:
  - lm-sensors
  - linux-cpupower
  - nvme-cli
  - powertop

profile::dotfiles::username: root

profile::common::services::resources:
  rpc-svcgssd:
    ensure: stopped
    enable: mask

profile::common::systemd::units:
  proxmox-cpu-power-policy.service:
    content: |
      [Unit]
      Description=Apply Proxmox CPU power policy
      After=multi-user.target

      [Service]
      Type=oneshot
      ExecStart=/bin/sh -c 'for cpu in /sys/devices/system/cpu/cpu*/cpufreq; do [ -d "$cpu" ] || continue; cat "$cpu/cpuinfo_min_freq" > "$cpu/scaling_min_freq"; echo 5000000 > "$cpu/scaling_max_freq"; echo powersave > "$cpu/scaling_governor"; done'
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
    enable: true
    active: true

ssh::server_options:
  PermitRootLogin: prohibit-password

ssh::client_options:
  KnownHostsCommand: '/usr/bin/sss_ssh_knownhosts %h'
