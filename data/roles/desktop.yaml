---
classes:
  - freeipa_firefox
  - nfs_config
  - profile::user_toolchain
  - profile::codex_mtls
  - neovim

profile::user_toolchain::npm_globals:
  - '@mermaid-js/mermaid-cli'
  - '@openai/codex'

profile::common::certs::vault_certs:
  codex:
    cert_chain_file: /home/user/.config/home-arpa/mtls/codex.crt
    cert_chain_mode: '0644'
    key_file: /home/user/.config/home-arpa/mtls/codex.key
    cert_data:
      common_name: "codex.%{facts.networking.fqdn}"
      alt_names: "codex.%{facts.networking.fqdn}"

packages::list:
  - ansible-core
  - antigravity
  - audacity
  - build-essential
  - calendar
  - calibre
  - cargo
  - containerd.io
  - docker-buildx-plugin
  - docker-ce
  - docker-ce-cli
  - docker-compose-plugin
  - easyeffects
  - fd-find
  - ffmpeg
  - gh
  - gimp
  - kdeconnect
  - kdenlive
  - libldap2-dev 
  - libsasl2-dev 
  - libssh-dev
  - mktorrent
  - nemo
  - nmap
  - nodejs
  - npm
  - obs-studio
  - opus-tools
  - pavucontrol
  - pdftk-java
  - python3-scp
  - qpwgraph
  - ripgrep
  - shellcheck
  - units
  - kitty
  - virt-viewer
  - vlc
  - xclip
  - xournalpp
  - wl-clipboard

packages::sources:
  docker:
    comment: 'Official Docker Repository'
    location: 'https://download.docker.com/linux/ubuntu'
    release: "%{facts.os.distro.codename}"
    repos: 'stable'
    key:
      id: '9DC858229FC7DD38854AE2D88D81803C0EBFCD88'
      source: 'https://download.docker.com/linux/ubuntu/gpg'
      ensure: absent
  github-cli:
    comment: 'Official GitHub CLI Repository'
    location: 'https://cli.github.com/packages'
    release: 'stable'
    repos: 'main'
    key:
      name: 'githubcli-archive-keyring.gpg'
      source: 'https://cli.github.com/packages/githubcli-archive-keyring.gpg'

  antigravity:
    comment: 'Antigravity Auto-Updater Repository'
    location: 'https://us-central1-apt.pkg.dev/projects/antigravity-auto-updater-dev/'
    release: 'antigravity-debian'
    repos: 'main'
    key:
      name: 'antigravity-repo-key.asc'
      source: 'https://us-central1-apt.pkg.dev/doc/repo-signing-key.gpg'

packages::ppas:
  - 'ppa:ubuntuhandbook1/audacity'
