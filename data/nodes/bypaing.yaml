---
# bypaing.home.arpa — multi-tenant Wolf/Moonlight cloud gaming server
# node_type: docker  →  inherits data/roles/docker.yaml
#   (profile::docker_host, docker packages, sysctl, cronjobs, alloy, promtail)

classes:
  - profile::nvidia_docker

packages::ppas:
  - 'ppa:graphics-drivers/ppa'

packages::sources:
  nvidia-container-toolkit:
    comment: 'NVIDIA Container Toolkit'
    # Flat repo; architecture interpolated from the OS fact (e.g. amd64).
    location: "https://nvidia.github.io/libnvidia-container/stable/deb/%{facts.os.architecture}"
    release: '/'
    key:
      # Retrieve the fingerprint:
      #   curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey \
      #     | gpg --dry-run --quiet --no-keyring --import --import-options import-show
      id: 'C95B321B61E88C1809C4F759DDCAE044F796ECB0'
      source: 'https://nvidia.github.io/libnvidia-container/gpgkey'

packages::list:
  - ubuntu-drivers-common
  - nvidia-driver-580
  - nvidia-container-toolkit

nfs_config::server_exports:
  '/opt/docker':
    clients: '*.home.arpa(sec=krb5p,rw,sync,no_subtree_check,root_squash)'
    atboot: true

profile::docker_host::git_deploy_projects:
  wolf: {}

kmod::list_of_loads:
  'uinput': {}

# DRI render node access for Wolf containers running under userns-remap.
# Container root (UID 0) maps to host UID 100000 (dockremap subuid start).
# The udev rule re-applies the ACL on every boot/hotplug; posix_acl handles
# the current session immediately on Puppet apply.
profile::nvidia_docker::extra_udev_rules:
  '99-wolf-dri.rules':
    rules:
      - 'SUBSYSTEM=="drm", KERNEL=="renderD*", RUN+="/usr/bin/setfacl -m u:100000:rw /dev/%k"'
      - 'SUBSYSTEM=="drm", KERNEL=="card*",    RUN+="/usr/bin/setfacl -m u:100000:rw /dev/%k"'

profile::nvidia_docker::posix_acls:
  '/dev/dri/renderD128':
    action: set
    permission:
      - 'user:100000:rw'
    provider: posixacl
  '/dev/dri/card0':
    action: set
    permission:
      - 'user:100000:rw'
    provider: posixacl
  # Wolf runs as container root (host UID 100000) and needs write access to its
  # config dir to migrate config files and generate key.pem/cert.pem on first run.
  # The default ACL ensures new files Wolf creates inherit the same permission.
  '/opt/docker/wolf/configs':
    action: set
    permission:
      - 'user:100000:rwx'
      - 'default:user:100000:rwx'
    provider: posixacl
  '/opt/docker/wolf/configs/player1':
    action: set
    permission:
      - 'user:100000:rwx'
      - 'default:user:100000:rwx'
    provider: posixacl
  '/opt/docker/wolf/configs/player2':
    action: set
    permission:
      - 'user:100000:rwx'
      - 'default:user:100000:rwx'
    provider: posixacl
