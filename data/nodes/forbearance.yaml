---
classes:
  - freeipa_firefox

tidy::files:
  downloads:
    path: /home/user/Downloads

packages::list:
  - build-essential
  - cargo
  - containerd.io
  - docker-buildx-plugin
  - docker-ce
  - docker-ce-cli
  - docker-compose-plugin
  - easyeffects
  - fd-find
  - nemo
  - neovim
  - neovim-qt
  - nodejs
  - npm
  - pavucontrol
  - qpwgraph
  - ripgrep
  - silversearcher-ag
  - virt-viewer
  - vlc
  - wl-clipboard

nfs::server::exports:
  '/home/user/Documents':
    clients: 'docker.home.arpa(sec=krb5p,ro,sync,no_subtree_check,no_root_squash)'
    mount: '/export/user_documents'

nfs::client::mounts:
  '/mnt/scratch':
    server: 'docker.home.arpa'
    share: 'scratch'
    nfs_v4: true
    options_nfsv4: 'proto=tcp,nolock,noatime,sec=krb5p'

packages::sources:
  docker:
    comment: 'Official Docker Repository'
    location: 'https://download.docker.com/linux/ubuntu'
    release: "%{facts.os.distro.codename}"
    repos: 'stable'
    key:
      id: '9DC858229FC7DD38854AE2D88D81803C0EBFCD88'
      source: 'https://download.docker.com/linux/ubuntu/gpg'
      ensure: absent

packages::ppas:
  - 'ppa:neovim-ppa/unstable'
