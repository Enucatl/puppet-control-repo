profile::common::sysctl_settings:
  net.ipv6.conf.enp7s0.accept_ra:
    value: 0
  net.ipv6.conf.enp7s0.autoconf:
    value: 0
  net.ipv6.conf.enp7s0.disable_ipv6:
    value: 1

profile::common::systemd_units:
  wol-enp7s0.service:
    content: |
      [Unit]
      Description=Enable Wake-on-LAN for enp7s0
      After=network.target

      [Service]
      Type=oneshot
      ExecStart=/sbin/ethtool -s enp7s0 wol g
      RemainAfterExit=yes

      [Install]
      WantedBy=multi-user.target
    enable: true
    active: true
