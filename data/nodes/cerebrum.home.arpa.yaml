---
# cerebrum.home.arpa — multi-tenant Wolf/Moonlight cloud gaming server
# Server-assigned docker role →  inherits data/roles/docker.yaml
#   (profile::docker_host, docker packages, sysctl, cronjobs, alloy, promtail)

nfs_config::server_exports:
  '/opt/docker':
    clients: '*.home.arpa(sec=krb5p,rw,sync,no_subtree_check,root_squash)'
    atboot: true

nfs_config::client_mounts:
  '/export/scratch':
    server: 'atlas.home.arpa'
    atboot: false
    options_nfsv4: '_netdev,nofail,x-systemd.automount,x-systemd.idle-timeout=10min,x-systemd.mount-timeout=10s,sec=krb5p'

profile::nvidia_docker::power_limit_watts: 400
profile::nvidia_docker::temp_target_celsius: 80

classes:
  - profile::nvidia_docker
  - profile::steam_dedup

packages::sources:
  nvidia-container-toolkit:
    comment: 'NVIDIA Container Toolkit'
    # Flat repo; architecture interpolated from the OS fact (e.g. amd64).
    location: "https://nvidia.github.io/libnvidia-container/stable/deb/%{facts.os.architecture}"
    release: '/'
    key:
      name: 'nvidia-container-toolkit.asc'
      source: 'https://nvidia.github.io/libnvidia-container/gpgkey'

packages::list:
  - clang-format
  - clang-tidy
  - libavcodec-dev
  - libavdevice-dev
  - libavfilter-dev
  - libavformat-dev
  - libavutil-dev
  - libsox-dev
  - libswresample-dev
  - libswscale-dev
  - nsight-systems
  - nvidia-container-toolkit
  - nvidia-driver-590-open
  - portaudio19-dev
  - rsync
  - ubuntu-drivers-common

kmod::list_of_loads:
  'uinput': {}

ssh::client_options:
  ProxyCommand: none
  KnownHostsCommand: '/usr/bin/sss_ssh_knownhosts %H'

freeipa::client::hostname: cerebrum.home.arpa
freeipa::client::ca_cert_file: /usr/local/share/ca-certificates/atlas-infrastructure.crt

profile::common::certs::vault_certs_defaults:
  vault_uri: 'https://vault.home.arpa:8200/v1/pki_int/issue/puppet'
  ca_trust: /etc/ssl/certs/ca-certificates.crt

profile::common::certs::directories:
  - /opt/docker

# Docker cannot exclude an image digest from prune. A never-started, labelled
# container keeps this costly pinned image referenced without using GPU or RAM.
# On pin upgrades, explicitly remove/recreate the anchor; a mismatch stops prune.
systemd::dropin_files:
  retain-paddle.conf:
    unit: docker-prune.service
    notify_service: false
    content: |
      [Service]
      Environment=RETAIN_IMAGE=ccr-2vdh3abv-pub.cnc.bj.baidubce.com/paddlepaddle/paddleocr-genai-vllm-server@sha256:bffd525308facf5dba2f8eca44ab476704a0ae3bfdcba25f77655973e4c0a7ca
      Environment=RETAIN_CONTAINER=puppet-retain-paddle-recognition
      ExecStartPre=/bin/sh -ec '\
        if /usr/bin/docker container inspect "$$RETAIN_CONTAINER" >/dev/null 2>&1; then \
          test "$$(/usr/bin/docker container inspect --format "{{.Image}}" "$$RETAIN_CONTAINER")" = "$$(/usr/bin/docker image inspect --format "{{.Id}}" "$$RETAIN_IMAGE")"; \
          test "$$(/usr/bin/docker container inspect --format "{{.Config.Labels.puppet_keep_paddle_recognition}}" "$$RETAIN_CONTAINER")" = true; \
        elif /usr/bin/docker image inspect "$$RETAIN_IMAGE" >/dev/null 2>&1; then \
          /usr/bin/docker create --pull=never --name "$$RETAIN_CONTAINER" --label puppet_keep_paddle_recognition=true --network none --userns host --entrypoint /bin/true "$$RETAIN_IMAGE"; \
        fi'
      ExecStart=
      ExecStart=/bin/sh -c '/usr/bin/docker system prune --all --force --filter until=24h --filter label!=puppet_keep_paddle_recognition=true 2>&1 | /usr/bin/logger -t docker-prune -p user.info'
