---
profile::common::cronjobs:
  # startup the proxmox backup server on the other host
  backup:
    minute: 55
    hour: 1
    weekday: 'Monday'
    user: root
    command: 'qm exec 200 -- bash -c "cd /opt/docker/puppet-control-repo/docker && uv run python vault/scripts/wake_on_lan.py --vm-id 100 --shutdown-delay 120" > /var/log/wake-proxmox-cortex.log 2>&1'
