---
profile::common::cronjobs:
  # startup the proxmox backup server on the other host
  backup:
    minute: 55
    hour: 1
    weekday: 'Monday'
    user: root
    command: 'qm guest exec 200 -- bash -c "cd /opt/docker/puppet-control-repo/docker && uv run python vault/scripts/wake_on_lan.py --ct-id 100 --shutdown-delay 120" > /var/log/wake-proxmox-cortex.log 2>&1'
  # enable checkpoint storage just before backup
  backup_enable_checkpoint:
    minute: 55
    hour: 1
    weekday: 'Monday'
    user: root
    command: 'pvesm set checkpoint --disable 0 > /var/log/pvesm-checkpoint-enable.log 2>&1'
  # disable checkpoint storage after backup is done
  backup_disable_checkpoint:
    minute: 0
    hour: 4
    weekday: 'Tuesday'
    user: root
    command: 'pvesm set checkpoint --disable 1 > /var/log/pvesm-checkpoint-disable.log 2>&1'
