---
profile::common::cronjobs:
  # startup the proxmox backup server on the other host
  backup:
    minute: 55
    hour: 1
    weekday: 'Monday'
    user: root
    command: '/usr/sbin/qm guest exec 200 -- bash -c "cd /opt/docker/puppet-control-repo/docker && uv run python vault/scripts/wake_on_lan.py --ct-id 100 --shutdown-delay 120" > /var/log/wake-proxmox-cortex.log 2>&1 && /usr/sbin/pvesm set checkpoint --disable 1 > /var/log/pvesm-checkpoint-disable.log 2>&1'
  # enable checkpoint storage just before backup
  backup_enable_checkpoint:
    minute: 55
    hour: 1
    weekday: 'Monday'
    user: root
    command: '/usr/sbin/pvesm set checkpoint --disable 0 > /var/log/pvesm-checkpoint-enable.log 2>&1'
