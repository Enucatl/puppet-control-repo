---
profile::common::cronjobs:
  uv-cache-prune:
    ensure: absent

profile::common::systemd_units:
  wake-proxmox-cortex.service:
    content: |
      [Unit]
      Description=Wake proxmox-cortex and start the backup storage container
      After=network-online.target
      Wants=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/bin/bash -lc '/usr/sbin/qm guest exec 200 --timeout 0 -- bash -lc "cd /opt/docker/puppet-control-repo/docker && HOME=/home/user /home/user/.local/bin/uv run python vault/scripts/wake_on_lan.py --ct-id 110 --shutdown-delay 120" > /var/log/wake-proxmox-cortex.log 2>&1'

  wake-proxmox-cortex.timer:
    content: |
      [Unit]
      Description=Wake proxmox-cortex before the weekly 01:00 UTC backup

      [Timer]
      OnCalendar=Mon *-*-* 00:53:00 UTC
      Persistent=true
      Unit=wake-proxmox-cortex.service

      [Install]
      WantedBy=timers.target
    enable: true
    active: true

  chronicle-enable.service:
    content: |
      [Unit]
      Description=Enable chronicle PBS storage before the weekly backup

      [Service]
      Type=oneshot
      ExecStart=/bin/bash -lc '/usr/sbin/pvesm set chronicle --disable 0 > /var/log/pvesm-chronicle-enable.log 2>&1'

  chronicle-enable.timer:
    content: |
      [Unit]
      Description=Enable chronicle PBS storage at 00:58 UTC on Monday

      [Timer]
      OnCalendar=Mon *-*-* 00:58:00 UTC
      Persistent=true
      Unit=chronicle-enable.service

      [Install]
      WantedBy=timers.target
    enable: true
    active: true

  chronicle-disable.service:
    content: |
      [Unit]
      Description=Disable chronicle PBS storage after the weekly backup window

      [Service]
      Type=oneshot
      ExecStart=/bin/bash -lc '/usr/sbin/pvesm set chronicle --disable 1 > /var/log/pvesm-chronicle-disable.log 2>&1'

  chronicle-disable.timer:
    content: |
      [Unit]
      Description=Disable chronicle PBS storage at 03:00 UTC on Monday

      [Timer]
      OnCalendar=Mon *-*-* 03:00:00 UTC
      Persistent=true
      Unit=chronicle-disable.service

      [Install]
      WantedBy=timers.target
    enable: true
    active: true
