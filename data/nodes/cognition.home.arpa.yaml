---
# cognition.home.arpa — multi-tenant Wolf/Moonlight cloud gaming server
# Server-assigned docker role →  inherits data/roles/docker.yaml
#   (profile::docker_host, docker packages, sysctl, cronjobs, alloy, promtail)

nfs_config::server_exports:
  '/opt/docker':
    clients: '*.home.arpa(sec=krb5p,rw,sync,no_subtree_check,root_squash)'
    atboot: true

nfs_config::client_mounts:
  '/export/scratch':
    server: 'atlas.home.arpa'
    atboot: false
    options_nfsv4: '_netdev,nofail,x-systemd.automount,x-systemd.idle-timeout=10min,x-systemd.mount-timeout=10s,sec=krb5p'

profile::nvidia_docker::power_limit_watts: 400
profile::nvidia_docker::temp_target_celsius: 80

classes:
  - profile::nvidia_docker

packages::sources:
  nvidia-container-toolkit:
    comment: 'NVIDIA Container Toolkit'
    # Flat repo; architecture interpolated from the OS fact (e.g. amd64).
    location: "https://nvidia.github.io/libnvidia-container/stable/deb/%{facts.os.architecture}"
    release: '/'
    key:
      name: 'nvidia-container-toolkit.asc'
      source: 'https://nvidia.github.io/libnvidia-container/gpgkey'

packages::list:
  - clang-format
  - clang-tidy
  - libavcodec-dev
  - libavdevice-dev
  - libavfilter-dev
  - libavformat-dev
  - libavutil-dev
  - libsox-dev
  - libswresample-dev
  - libswscale-dev
  - nsight-systems
  - nvidia-container-toolkit
  - nvidia-driver-590-open
  - portaudio19-dev
  - rsync
  - ubuntu-drivers-common

profile::docker_host::git_deploy_projects:
  wolf:
    ensure: absent
  vllm:
    ensure: absent

kmod::list_of_loads:
  'uinput': {}

ssh::client_options:
  ProxyCommand: none
  KnownHostsCommand: '/usr/bin/sss_ssh_knownhosts %H'

freeipa::client::server: ipa.home.arpa
freeipa::client::hostname: cognition.home.arpa
freeipa::client::ca_cert_file: /usr/local/share/ca-certificates/atlas-infrastructure.crt

profile::common::certs::vault_certs_defaults:
  vault_uri: 'https://vault.home.arpa:8200/v1/pki_int/issue/puppet'
  ca_trust: /etc/ssl/certs/ca-certificates.crt

profile::alloy::loki_url: 'https://loki.atlas.home.arpa/loki/api/v1/push'
profile::beszel_agent::hub_url: 'https://beszel-agent.atlas.home.arpa'

systemd::dropin_files:
  puppet-crypto.conf:
    unit: puppet.service
    content: |
      [Service]
      Environment=OPENSSL_CONF=/etc/puppetlabs/puppet/openssl.cnf
      ExecStart=
      ExecStart=/opt/puppetlabs/puppet/bin/ruby -r /usr/local/libexec/openvox-child-policy.rb /opt/puppetlabs/puppet/bin/puppet agent $PUPPET_EXTRA_OPTS --no-daemonize
    require: File[/usr/local/libexec/openvox-child-policy.rb]

nfs_config::ipa_server: ipa.home.arpa

profile::common::certs::directories:
  - /opt/docker
