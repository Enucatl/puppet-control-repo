---
classes:
  - posix_acl::requirements
  - samba
  - tidy
  - vault_secrets::vault_cert

cronjobs:
  # backup the hashicorp vault to a location that is picked up by duplicati
  vault-snapshot:
    minute: 0
    hour: 0
    weekday: 'Monday'
    user: root
    command: '/opt/docker/infra/vault/scripts/backup.sh 2>&1'
  paperless-snapshot:
    minute: 0
    hour: 0
    weekday: 'Monday'
    user: root
    command: '/opt/docker/paperless-ngx/scripts/backup.sh 2>&1'


grafana_alloy::config: |
  // 1. Output: Remote Loki (Traefik)
  loki.write "remote_loki" {
    endpoint {
      url = "https://loki.docker.home.arpa/loki/api/v1/push"
      
      // MEMORY OPTIMIZATION:
      // Send smaller batches more frequently to clear RAM.
      batch_wait = "1s"      // Default is often higher, send faster
      batch_size = "512KB"   // Default is 1MB+, reduce to keep RAM usage low
    }

    // Ensure the Write Ahead Log (WAL) is managed
    wal {
      enabled = true
      // If the remote endpoint is down, store on disk, don't bloat RAM
      max_segment_age = "1h" 
    }
  }

  // 2. Input: Systemd Journal
  loki.source.journal "read_journal" {
    // If you restart Alloy, 12h might pull too much history at once. 
    // 1h is usually safer for restarts unless you strictly need the backfill.
    max_age = "1h" 
    labels  = {
      job  = "systemd-journal",
      host     = "%{trusted.certname}",
    }
    forward_to = [loki.write.remote_loki.receiver]
  }

  // 3. Input: /var/log Files
  local.file_match "varlogs_files" {
    path_targets = [{
      // Explicitly exclude gzipped files to prevent unzipping in memory
      __path__ = "/var/log/*.log",
      job      = "varlogs",
      host     = "%{trusted.certname}",
    }]
  }

  loki.source.file "varlogs_scrape" {
    targets    = local.file_match.varlogs_files.targets
    forward_to = [loki.write.remote_loki.receiver]
  }

  // ==========================================
  // DOCKER LOG SCRAPING (Only on Docker Hosts)
  // ==========================================
  discovery.docker "containers" {
    host = "unix:///var/run/docker.sock"
    refresh_interval = "60s"
  }

  discovery.relabel "docker_relabel" {
    targets = discovery.docker.containers.targets
    rule {
      source_labels = ["__meta_docker_container_name"]
      regex = "/(.*)"
      action = "replace"
      target_label = "container_name"
    }
    rule {
      target_label = "job"
      replacement = "docker"
    }
    // 2. CRITICAL: DROP Loki logs to prevent feedback loops
    rule {
      source_labels = ["container_name"]
      regex = "grafana-loki-loki-1" 
      action = "drop"
    }
  }

  loki.source.docker "docker_logs" {
    targets = discovery.relabel.docker_relabel.output
    forward_to = [loki.write.remote_loki.receiver]
    host = "unix:///var/run/docker.sock"
    labels = {"app" = "docker"}
  }


samba::workgroup: 'WORKGROUP'
samba::server_string: 'docker'
samba::security: 'user'
samba::map_to_guest: 'Bad User'
samba::package_ensure: 'installed'
samba::hosts_allow:
   - '10.0.0.'
samba::hosts_deny:
   - 'ALL'
samba::shares:
  'scans':
    comment: 'Printer Uploads'
    path: '/opt/paperless-consume'
    browseable: true
    writable: true
    valid_users: ['printer']
    force_user: 'printer'
    create_mask: '0666'
    directory_mask: '0777'

tidy::files:
  downloads:
    path: /home/user/Downloads

packages::list:
  - python3-docker

promtail::scrape_configs_hash:
  scrape_configs:
    - job_name: docker
      docker_sd_configs:
        - host: unix:///var/run/docker.sock
          refresh_interval: 5s
      relabel_configs:
        - source_labels: 
            - "__meta_docker_container_name"
          regex: "/(.*)"
          target_label: 'container_name'

vault_certs_default_location: /opt/docker/traefik/data/certs
vault_certs_defaults:
  ensure: 'present'
  vault_uri: 'https://hcv.home.arpa:8200/v1/pki_int/issue/general'
  auth_path: 'cert'
  cert_data:
    ttl: '2160h'  # 90 days
  renewal_threshold: 5
  cert_chain_owner: 'user'
  cert_chain_group: 'user'
  key_owner: 'user'
  key_group: 'user'
  key_mode: '0640'

vault_certs:
  docker:
    cert_data:
      common_name: '*.docker.home.arpa'
      alt_names: '*.docker.home.arpa,docker.home.arpa'
