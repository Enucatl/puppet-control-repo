---
classes:
  - profile::docker_node

nfs_config::server_exports:
  '/scratch':
    clients: '*.home.arpa(sec=krb5p,rw,sync,no_subtree_check,no_root_squash)'
    atboot: true
  '/opt/docker':
    clients: '*.home.arpa(sec=krb5p,rw,sync,no_subtree_check,root_squash)'
    atboot: true

nfs_config::client_mounts:
  '/export/Documents':
    server: 'forbearance.home.arpa'
    options_nfsv4: '_netdev,nofail,x-systemd.automount,x-systemd.idle-timeout=10min,x-systemd.mount-timeout=10s,sec=krb5p'

profile::docker_host::git_deploy_projects:
  airflow:
    pull: true
    build_command: 'docker compose --profile runner build exam download-zanzara puppet-release-watch cyber-analyst'
  authelia: {}
  backrest: {}
  camillo:
    build_command: "docker compose build"
  checkmk: {}
  crabberbot:
    build_command: 'YT_DLP_COMMIT_HASH=$(git ls-remote https://github.com/Enucatl/yt-dlp.git refs/heads/master | cut -f1) CARGO_PACKAGE_VERSION=$(git describe --long | sed "s/-/./") docker compose build'
  echo-server: {}
  grafana-loki: {}
  puppet-control-repo:
    branch: production
    build_command: "docker compose -f docker/docker-compose.yml build"
    compose_file: docker/docker-compose.yml
    watch_dir: docker
  iventoy:
    ensure: absent
  kms: {}
  monerod:
    build_command: "docker compose build"
  paperless-ai:
    build_command: "docker compose build"
  protonmail-bridge: {}
  qbittorrent: {}
  rclone: {}
  rss-to-telegram-bot: {}
  send-bills:
    build_command: 'VERSION=$(uv run --with setuptools-git-versioning setuptools-git-versioning); docker compose build --build-arg VERSION="$VERSION"'
  teamspeak: {}
  tor-i2pd: {}
  traefik: {}
  unifi-network-application:
    ensure: absent

profile::docker_host::scheduled_refresh: true

packages::list:
  - qemu-guest-agent

profile::common::services::resources:
  qemu-guest-agent:
    ensure: running
    enable: true
  networkd-dispatcher:
    ensure: stopped
    enable: false

profile::common::systemd::units:
  backrest-kinit.service:
    content: |
      [Unit]
      Description=Acquire Backrest Kerberos credentials
      Wants=network-online.target
      After=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/kinit -k -t /etc/krb5-backrest.keytab -c FILE:/tmp/krb5cc_175200010 backrest@HOME.ARPA
      ExecStart=/bin/chown backrest:backrest /tmp/krb5cc_175200010
    enable: false
    active: false
    require: File[/etc/krb5-backrest.keytab]
  backrest-kinit.timer:
    content: |
      [Unit]
      Description=Refresh Backrest Kerberos credentials

      [Timer]
      OnBootSec=1min
      OnUnitActiveSec=12h
      Unit=backrest-kinit.service

      [Install]
      WantedBy=timers.target
    enable: true
    active: true
    require: Systemd::Unit_file[backrest-kinit.service]
  automation-exam.service:
    content: |
      [Unit]
      Description=Run exam automation pipeline
      Wants=network-online.target docker.service
      After=network-online.target docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      User=user_l
      WorkingDirectory=/opt/docker/airflow
      ExecStartPre=/usr/bin/docker compose up -d postgres-outputs
      ExecStart=/usr/bin/docker compose run --build --rm --no-deps exam
      SyslogIdentifier=automation-exam
      StandardOutput=journal
      StandardError=journal
    enable: false
    active: false
  automation-exam.timer:
    content: |
      [Unit]
      Description=Run exam automation hourly

      [Timer]
      OnCalendar=*-*-* *:00:00 UTC
      Persistent=false
      Unit=automation-exam.service

      [Install]
      WantedBy=timers.target
    enable: true
    active: true
    require: Systemd::Unit_file[automation-exam.service]
  automation-download-zanzara.service:
    content: |
      [Unit]
      Description=Run La Zanzara download pipeline
      Wants=network-online.target docker.service
      After=network-online.target docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      User=user_l
      WorkingDirectory=/opt/docker/airflow
      ExecStartPre=/usr/bin/docker compose up -d postgres-outputs
      ExecStart=/usr/bin/docker compose run --build --rm --no-deps download-zanzara
      SyslogIdentifier=automation-download-zanzara
      StandardOutput=journal
      StandardError=journal
    enable: false
    active: false
  automation-download-zanzara.timer:
    content: |
      [Unit]
      Description=Run La Zanzara download daily

      [Timer]
      OnCalendar=*-*-* 00:00:00 UTC
      Persistent=false
      Unit=automation-download-zanzara.service

      [Install]
      WantedBy=timers.target
    enable: true
    active: true
    require: Systemd::Unit_file[automation-download-zanzara.service]
  automation-puppet-release-watch.service:
    content: |
      [Unit]
      Description=Run Puppet release watch pipeline
      Wants=network-online.target docker.service
      After=network-online.target docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      User=user_l
      WorkingDirectory=/opt/docker/airflow
      ExecStartPre=/usr/bin/docker compose up -d postgres-outputs
      ExecStart=/usr/bin/docker compose run --build --rm --no-deps puppet-release-watch
      SyslogIdentifier=automation-puppet-release-watch
      StandardOutput=journal
      StandardError=journal
    enable: false
    active: false
  automation-puppet-release-watch.timer:
    content: |
      [Unit]
      Description=Run Puppet release watch daily

      [Timer]
      OnCalendar=*-*-* 00:00:00 UTC
      Persistent=false
      Unit=automation-puppet-release-watch.service

      [Install]
      WantedBy=timers.target
    enable: true
    active: true
    require: Systemd::Unit_file[automation-puppet-release-watch.service]
  automation-cyber-analyst.service:
    content: |
      [Unit]
      Description=Run monthly cyber analyst pipeline
      Wants=network-online.target docker.service
      After=network-online.target docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      User=user_l
      WorkingDirectory=/opt/docker/airflow
      ExecStartPre=/usr/bin/docker compose up -d postgres-outputs
      ExecStart=/usr/bin/docker compose run --build --rm --no-deps cyber-analyst
      SyslogIdentifier=automation-cyber-analyst
      StandardOutput=journal
      StandardError=journal
    enable: false
    active: false
  automation-cyber-analyst.timer:
    content: |
      [Unit]
      Description=Run cyber analyst monthly

      [Timer]
      OnCalendar=*-*-01 03:00:00 UTC
      Persistent=false
      Unit=automation-cyber-analyst.service

      [Install]
      WantedBy=timers.target
    enable: true
    active: true
    require: Systemd::Unit_file[automation-cyber-analyst.service]

profile::common::cron::jobs:
  # backup the hashicorp vault to a location that is picked up by duplicati
  vault-snapshot:
    minute: 0
    hour: 1
    weekday: 'Monday'
    user: root
    command: '/opt/docker/puppet-control-repo/docker/vault/scripts/backup.sh 2>&1 | /usr/bin/logger -t vault-snapshot -p user.info'
  paperless-snapshot:
    minute: 0
    hour: 1
    weekday: 'Monday'
    user: root
    command: '/opt/docker/paperless-ai/backup.sh 2>&1 | /usr/bin/logger -t paperless-snapshot -p user.info'

profile::common::certs::vault_certs_default_location: /opt/docker/traefik/data/certs

profile::common::certs::vault_certs:
  docker:
    cert_data:
      common_name: '*.docker.home.arpa'
      alt_names: '*.docker.home.arpa,docker.home.arpa'
    key_mode: '0640'
  airflow:
    cert_chain_file: /opt/docker/airflow/secrets/fullchain.pem
    cert_chain_owner: 150000
    cert_chain_group: 100000
    cert_chain_mode: '0640'
    key_file: /opt/docker/airflow/secrets/key.pem
    key_owner: 150000
    key_group: 100000
    key_mode: '0600'
  camillo:
    cert_chain_file: /opt/docker/camillo/secrets/fullchain.pem
    cert_chain_owner: 110000
    cert_chain_group: 110000
    cert_chain_mode: '0640'
    key_file: /opt/docker/camillo/secrets/key.pem
    key_owner: 110000
    key_group: 110000
    key_mode: '0600'
  wolf:
    cert_chain_file: /opt/docker/puppet-control-repo/docker/wolf/secrets/fullchain.pem
    cert_chain_owner: 101000
    cert_chain_group: 100000
    cert_chain_mode: '0640'
    key_file: /opt/docker/puppet-control-repo/docker/wolf/secrets/key.pem
    key_owner: 101000
    key_group: 100000
    key_mode: '0600'
    cert_data:
      common_name: wolf.docker.home.arpa
      alt_names: wolf.docker.home.arpa

