---
classes:
  - posix_acl::requirements
  - samba
  - tidy
  - vault_secrets::vault_cert

grafana_alloy::config: |
  // 1. Output: Remote Loki (Traefik)
  loki.write "remote_loki" {
    endpoint {
      // Using HTTPS because your Traefik handles TLS
      url = "https://loki.docker.home.arpa/loki/api/v1/push"
    }
  }

  // 2. Input: Systemd Journal
  loki.source.journal "read_journal" {
    max_age = "12h"
    labels  = {
      job  = "systemd-journal",
      // Hiera will replace this value before creating the file
      host = "%{trusted.certname}",
    }
    forward_to = [loki.write.remote_loki.receiver]
  }

  // 3. Input: /var/log Files
  // Step A: Define where to look and what static labels to apply
  local.file_match "varlogs_files" {
    path_targets = [{
      __path__ = "/var/log/*.log",
      job      = "varlogs",
      host     = "%{trusted.certname}",
    }]
  }

  // Step B: Scrape the files found in Step A
  loki.source.file "varlogs_scrape" {
    targets    = local.file_match.varlogs_files.targets
    forward_to = [loki.write.remote_loki.receiver]
  }

  // ==========================================
  // DOCKER LOG SCRAPING (Only on Docker Hosts)
  // ==========================================
  discovery.docker "containers" {
    host = "unix:///var/run/docker.sock"
    refresh_interval = "5s"
  }

  discovery.relabel "docker_relabel" {
    targets = discovery.docker.containers.targets
    rule {
      source_labels = ["__meta_docker_container_name"]
      regex = "/(.*)"
      action = "replace"
      target_label = "container_name"
    }
    rule {
      target_label = "job"
      replacement = "docker"
    }
  }

  loki.source.docker "docker_logs" {
    targets = discovery.relabel.docker_relabel.output
    forward_to = [loki.write.remote_loki.receiver]
    host = "unix:///var/run/docker.sock"
    labels = {"app" = "docker"}
  }


samba::workgroup: 'WORKGROUP'
samba::server_string: 'docker'
samba::security: 'user'
samba::map_to_guest: 'Bad User'
samba::package_ensure: 'installed'
samba::hosts_allow:
   - '10.0.0.'
samba::hosts_deny:
   - 'ALL'
samba::shares:
  'scans':
    comment: 'Printer Uploads'
    path: '/opt/paperless-consume'
    browseable: true
    writable: true
    valid_users: ['printer']
    force_user: 'printer'
    create_mask: '0666'
    directory_mask: '0777'

tidy::files:
  downloads:
    path: /home/user/Downloads

packages::list:
  - python3-docker

promtail::scrape_configs_hash:
  scrape_configs:
    - job_name: docker
      docker_sd_configs:
        - host: unix:///var/run/docker.sock
          refresh_interval: 5s
      relabel_configs:
        - source_labels: 
            - "__meta_docker_container_name"
          regex: "/(.*)"
          target_label: 'container_name'

vault_certs_default_location: /opt/docker/traefik/data/certs
vault_certs_defaults:
  ensure: 'present'
  vault_uri: 'https://hcv.home.arpa:8200/v1/pki_int/issue/general'
  auth_path: 'cert'
  cert_data:
    ttl: '2160h'  # 90 days
  renewal_threshold: 5
  cert_chain_owner: 'user'
  cert_chain_group: 'user'
  key_owner: 'user'
  key_group: 'user'

vault_certs:
  docker:
    cert_data:
      common_name: '*.docker.home.arpa'
      alt_names: '*.docker.home.arpa,docker.home.arpa'
