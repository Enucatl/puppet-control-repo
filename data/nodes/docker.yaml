---
classes:
  - profile::docker_node

nfs_config::server_exports:
  '/scratch':
    clients: '*.home.arpa(sec=krb5p,rw,sync,no_subtree_check,no_root_squash)'
    atboot: true
  '/opt/docker':
    clients: '*.home.arpa(sec=krb5p,rw,sync,no_subtree_check,root_squash)'
    atboot: true

nfs_config::client_mounts:
  '/export/Documents':
    server: 'forbearance.home.arpa'

profile::docker_host::git_deploy_projects:
  airflow:
    pull: true
    build_command: "docker compose build --build-arg AIRFLOW_VERSION=$(cat build/VERSION)"
  authelia: {}
  checkmk: {}
  crabberbot:
    pull: false
    build_command: 'YT_DLP_COMMIT_HASH=$(git ls-remote https://github.com/Enucatl/yt-dlp.git refs/heads/master | cut -f1) CARGO_PACKAGE_VERSION=$(git describe --long | sed "s/-/./") docker compose build'
  duplicati: {}
  echo-server: {}
  grafana-loki: {}
  infra:
    ensure: absent
  puppet-control-repo:
    compose_file: docker/docker-compose.yml
  iventoy: {}
  kms: {}
  monerod:
    pull: false
    build_command: "docker compose build"
  paperless-ngx:
    compose_file: docker/compose/docker-compose.postgres-tika.yml
  protonmail-bridge: {}
  qbittorrent: {}
  rclone: {}
  rss-to-telegram-bot: {}
  send-bills:
    compose_file: docker-compose.yml
  teamspeak: {}
  tor-i2pd: {}
  traefik: {}
  unifi-network-application: {}

profile::common::cronjobs:
  # backup the hashicorp vault to a location that is picked up by duplicati
  vault-snapshot:
    minute: 0
    hour: 1
    weekday: 'Monday'
    user: root
    command: '/opt/docker/puppet-control-repo/docker/vault/scripts/backup.sh 2>&1'
  paperless-snapshot:
    minute: 0
    hour: 1
    weekday: 'Monday'
    user: root
    command: '/opt/docker/paperless-ngx/scripts/backup.sh 2>&1'

profile::common::vault_certs_default_location: /opt/docker/traefik/data/certs
profile::common::vault_certs_defaults:
  ensure: 'present'
  vault_uri: 'https://hcv.home.arpa:8200/v1/pki_int/issue/general'
  auth_path: 'cert'
  cert_data:
    ttl: '2160h'  # 90 days
  renewal_threshold: 5
  cert_chain_owner: 'user'
  cert_chain_group: 'user'
  key_owner: 'user'
  key_group: 'user'
  key_mode: '0640'

profile::common::vault_certs:
  docker:
    cert_data:
      common_name: '*.docker.home.arpa'
      alt_names: '*.docker.home.arpa,docker.home.arpa'

puppet_configuration::settings:
  autosign:
    section: server
    setting: autosign
    value: /etc/puppetlabs/code/environments/production/scripts/autosign.py
  external_node_classifier_node_terminus:
    section: server
    setting: node_terminus
    value: exec
  external_node_classifier_external_nodes:
    section: server
    setting: external_nodes
    value: /etc/puppetlabs/code/environments/production/scripts/external_node_classifier.py

samba::workgroup: 'WORKGROUP'
samba::server_string: 'docker'
samba::security: 'user'
samba::map_to_guest: 'Bad User'
samba::package_ensure: 'installed'
samba::extra_global_options:
  # Reject NTLMv1 — it is crackable offline and vulnerable to relay attacks.
  # Suricata (ET INFO NTLMv1 Session Setup Response) flagged the printer
  # using NTLMv1; this forces NTLMv2 for all clients.
  'ntlm auth': 'ntlmv2-only'
samba::hosts_allow:
   - '10.0.0.'
   - '10.0.20.'
samba::hosts_deny:
   - 'ALL'
samba::shares:
  'scans':
    comment: 'Printer Uploads'
    path: '/opt/paperless-consume'
    browseable: true
    writable: true
    valid_users: ['printer']
    force_user: 'printer'
    create_mask: '0666'
    directory_mask: '0777'

  'shared_pictures':
    comment: 'Shared Pictures'
    path: '/scratch/shared_pictures'
    browseable: true
    writable: true
    force_user: 'user'
    force_group: 'user'
    create_mask: '0660'
    directory_mask: '0770'
    valid_users: ['pictures']
