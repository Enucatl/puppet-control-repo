---
classes:
  - posix_acl::requirements
  - samba
  - tidy
  - vault_secrets::vault_cert

samba::workgroup: 'WORKGROUP'
samba::server_string: 'docker.home.arpa'
samba::security: 'user'
samba::map_to_guest: 'Bad User'
samba::package_ensure: 'installed'
samba::shares:
  'scans':
    comment: 'Printer Uploads'
    path: '/opt/paperless-consume'
    browseable: true
    writable: true
    valid_users: ['printer']
    force_user: 'printer'
    create_mask: '0660'
    directory_mask: '0770'

tidy::files:
  downloads:
    path: /home/user/Downloads

promtail::scrape_configs_hash:
  scrape_configs:
    - job_name: docker
      docker_sd_configs:
        - host: unix:///var/run/docker.sock
          refresh_interval: 5s
      relabel_configs:
        - source_labels: 
            - "__meta_docker_container_name"
          regex: "/(.*)"
          target_label: 'container_name'

vault_certs_default_location: /opt/docker/traefik/data/certs
vault_certs_defaults:
  ensure: 'present'
  vault_uri: 'https://hcv.home.arpa:8200/v1/pki_int/issue/general'
  auth_path: 'cert'
  cert_data:
    ttl: '2160h'  # 90 days
  renewal_threshold: 5
  cert_chain_owner: 'user'
  cert_chain_group: 'user'
  key_owner: 'user'
  key_group: 'user'

vault_certs:
  docker:
    cert_data:
      common_name: '*.docker.home.arpa'
      alt_names: '*.docker.home.arpa,docker.home.arpa'
