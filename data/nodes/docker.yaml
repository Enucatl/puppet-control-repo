---
lookup_options:
  systemd::journald_settings:
    merge: deep
  puppet_configuration::settings:
    merge: deep

classes:
  - profile::docker_host

freeipa_users::user_groups:
  user:
    - docker

kmod::list_of_loads:
  'br_netfilter': {}

nfs_config::server_exports:
  '/scratch':
    clients: '*.home.arpa(sec=krb5p,rw,sync,no_subtree_check,no_root_squash)'
    atboot: true
  '/opt/docker':
    clients: '*.home.arpa(sec=krb5p,rw,sync,no_subtree_check,root_squash)'
    atboot: true

nfs_config::client_mounts:
  '/export/Documents':
    server: 'forbearance.home.arpa'

packages::sources:
  docker:
    comment: 'Official Docker Repository'
    location: 'https://download.docker.com/linux/ubuntu'
    release: "%{facts.os.distro.codename}"
    repos: 'stable'
    key:
      id: '9DC858229FC7DD38854AE2D88D81803C0EBFCD88'
      source: 'https://download.docker.com/linux/ubuntu/gpg'
      ensure: absent

packages::list:
  - docker-ce
  - docker-ce-cli
  - containerd.io
  - docker-buildx-plugin
  - docker-compose-plugin
  - ffmpeg
  - parallel
  - python3-docker

profile::alloy::enable_docker: true

profile::docker_host::git_deploy_projects:
  airflow:
    pull: true
    build_command: "docker compose build --build-arg AIRFLOW_VERSION=$(cat build/VERSION)"
  authelia: {}
  checkmk: {}
  crabberbot:
    pull: false
    build_command: 'CARGO_PACKAGE_VERSION=$(git describe --long | sed "s/-/./") docker compose build'
  duplicati: {}
  echo-server: {}
  grafana-loki: {}
  infra: {}
  iventoy: {}
  kms: {}
  monerod:
    pull: false
    build_command: "docker compose build"
  paperless-ngx:
    compose_file: docker/compose/docker-compose.postgres-tika.yml
  protonmail-bridge: {}
  qbittorrent: {}
  rclone: {}
  rss-to-telegram-bot: {}
  send-bills:
    compose_file: docker-compose.yml
  teamspeak: {}
  tor-i2pd: {}
  traefik: {}
  unifi-network-application: {}

profile::common::cronjobs:
  # Remove unused Docker images, containers, networks, and build cache.
  # --all: removes all unused images (not just dangling ones)
  # --force: skips the confirmation prompt
  # --filter until=Nh: only removes objects not used in the last N hours,
  #   giving recently-pulled but not-yet-started containers a grace period.
  # Volumes are intentionally excluded (no --volumes flag) to avoid data loss.
  docker-prune:
    minute: 0
    hour: 3
    weekday: 'Sunday'
    user: root
    command: '/usr/bin/docker system prune --all --force 2>&1'
  # backup the hashicorp vault to a location that is picked up by duplicati
  vault-snapshot:
    minute: 0
    hour: 1
    weekday: 'Monday'
    user: root
    command: '/opt/docker/infra/vault/scripts/backup.sh 2>&1'
  paperless-snapshot:
    minute: 0
    hour: 1
    weekday: 'Monday'
    user: root
    command: '/opt/docker/paperless-ngx/scripts/backup.sh 2>&1'

profile::common::sysctl_settings:
  net.ipv6.conf.all.accept_redirects:
    value: 0
  net.ipv6.conf.default.accept_redirects:
    value: 0
  net.ipv6.conf.all.forwarding:
    value: 1
  net.ipv6.conf.default.forwarding:
    value: 1
  net.ipv6.conf.all.accept_ra:
    value: 2
  net.ipv6.conf.default.accept_ra:
    value: 2
  net.ipv6.conf.all.proxy_ndp:
    value: 1
  net.ipv6.conf.default.proxy_ndp:
    value: 1

profile::common::vault_certs_default_location: /opt/docker/traefik/data/certs
profile::common::vault_certs_defaults:
  ensure: 'present'
  vault_uri: 'https://hcv.home.arpa:8200/v1/pki_int/issue/general'
  auth_path: 'cert'
  cert_data:
    ttl: '2160h'  # 90 days
  renewal_threshold: 5
  cert_chain_owner: 'user'
  cert_chain_group: 'user'
  key_owner: 'user'
  key_group: 'user'
  key_mode: '0640'

profile::common::vault_certs:
  docker:
    cert_data:
      common_name: '*.docker.home.arpa'
      alt_names: '*.docker.home.arpa,docker.home.arpa'

promtail::scrape_configs_hash:
  scrape_configs:
    - job_name: docker
      docker_sd_configs:
        - host: unix:///var/run/docker.sock
          refresh_interval: 5s
      relabel_configs:
        - source_labels: 
            - "__meta_docker_container_name"
          regex: "/(.*)"
          target_label: 'container_name'

puppet_configuration::settings:
  autosign:
    section: server
    setting: autosign
    value: /etc/puppetlabs/code/environments/production/scripts/autosign.py
  external_node_classifier_node_terminus:
    section: server
    setting: node_terminus
    value: exec
  external_node_classifier_external_nodes:
    section: server
    setting: external_nodes
    value: /etc/puppetlabs/code/environments/production/scripts/external_node_classifier.py

samba::workgroup: 'WORKGROUP'
samba::server_string: 'docker'
samba::security: 'user'
samba::map_to_guest: 'Bad User'
samba::package_ensure: 'installed'
samba::extra_global_options:
  # Reject NTLMv1 — it is crackable offline and vulnerable to relay attacks.
  # Suricata (ET INFO NTLMv1 Session Setup Response) flagged the printer
  # using NTLMv1; this forces NTLMv2 for all clients.
  'ntlm auth': 'ntlmv2-only'
samba::hosts_allow:
   - '10.0.0.'
   - '10.0.20.'
samba::hosts_deny:
   - 'ALL'
samba::shares:
  'scans':
    comment: 'Printer Uploads'
    path: '/opt/paperless-consume'
    browseable: true
    writable: true
    valid_users: ['printer']
    force_user: 'printer'
    create_mask: '0666'
    directory_mask: '0777'
        
  'shared_pictures':
    comment: 'Shared Pictures'
    path: '/scratch/shared_pictures'
    browseable: true
    writable: true
    force_user: 'user'
    force_group: 'user'
    create_mask: '0660'
    directory_mask: '0770'
    valid_users: ['pictures']
