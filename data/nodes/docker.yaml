freeipa_users::users:
  backrest:
    first: Backrest
    last: Backup
    keytab: /etc/krb5-backrest.keytab
  ldap_ro:
    first: ldap
    last: ro
  printer:
    first: printer
    last: printer
  airflow:
    first: airflow
    last: airflow

samba::workgroup: 'WORKGROUP'
samba::server_string: 'docker'
samba::security: 'user'
samba::map_to_guest: 'Bad User'
samba::package_ensure: 'installed'
samba::extra_global_options:
  # Reject NTLMv1 — it is crackable offline and vulnerable to relay attacks.
  # Suricata (ET INFO NTLMv1 Session Setup Response) flagged the printer
  # using NTLMv1; this forces NTLMv2 for all clients.
  'ntlm auth': 'ntlmv2-only'
samba::hosts_allow:
   - '10.0.0.'
   - '10.0.20.'
samba::hosts_deny:
   - 'ALL'
samba::shares:
  'scans':
    comment: 'Printer Uploads'
    path: '/opt/paperless-consume'
    browseable: true
    writable: true
    valid_users: ['printer']
    force_user: 'printer'
    create_mask: '0666'
    directory_mask: '0777'

  'shared_pictures':
    comment: 'Shared Pictures'
    path: '/scratch/shared_pictures'
    browseable: true
    writable: true
    force_user: 'user'
    force_group: 'user'
    create_mask: '0660'
    directory_mask: '0770'
    valid_users: ['pictures']
