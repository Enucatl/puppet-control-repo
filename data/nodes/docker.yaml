---
classes:
  - profile::docker_node

nfs_config::server_exports:
  '/scratch':
    clients: '*.home.arpa(sec=krb5p,rw,sync,no_subtree_check,no_root_squash)'
    atboot: true
  '/opt/docker':
    clients: '*.home.arpa(sec=krb5p,rw,sync,no_subtree_check,root_squash)'
    atboot: true

nfs_config::client_mounts:
  '/export/Documents':
    server: 'forbearance.home.arpa'

profile::docker_host::git_deploy_projects:
  airflow:
    pull: true
    build_command: 'AIRFLOW_VERSION="$(python3 scripts/airflow-version)" docker compose build'
    deploy_command: 'AIRFLOW_VERSION="$(python3 scripts/airflow-version)" docker compose up -d --force-recreate'
  authelia: {}
  checkmk: {}
  crabberbot:
    build_command: 'YT_DLP_COMMIT_HASH=$(git ls-remote https://github.com/Enucatl/yt-dlp.git refs/heads/master | cut -f1) CARGO_PACKAGE_VERSION=$(git describe --long | sed "s/-/./") docker compose build'
  duplicati: {}
  echo-server: {}
  grafana-loki: {}
  puppet-control-repo:
    compose_file: docker/docker-compose.yml
    branch: production
    watch_dir: docker
  iventoy:
    ensure: absent
  kms: {}
  monerod:
    build_command: "docker compose build"
  paperless-ai:
    build_command: "docker compose build"
  protonmail-bridge: {}
  qbittorrent: {}
  rclone: {}
  rss-to-telegram-bot: {}
  send-bills:
    build_command: 'VERSION=$(uv run --with setuptools-git-versioning setuptools-git-versioning); docker compose build --build-arg VERSION="$VERSION"'
  teamspeak: {}
  tor-i2pd: {}
  traefik: {}
  unifi-network-application:
    ensure: absent

profile::docker_host::scheduled_refresh: true

packages::list:
  - qemu-guest-agent

profile::common::services:
  qemu-guest-agent:
    ensure: running
    enable: true

profile::common::cronjobs:
  # backup the hashicorp vault to a location that is picked up by duplicati
  vault-snapshot:
    minute: 0
    hour: 1
    weekday: 'Monday'
    user: root
    command: '/opt/docker/puppet-control-repo/docker/vault/scripts/backup.sh 2>&1 | /usr/bin/logger -t vault-snapshot -p user.info'
  paperless-snapshot:
    minute: 0
    hour: 1
    weekday: 'Monday'
    user: root
    command: '/opt/docker/paperless-ai/backup.sh 2>&1 | /usr/bin/logger -t paperless-snapshot -p user.info'

profile::common::vault_certs_default_location: /opt/docker/traefik/data/certs
profile::common::vault_certs_defaults:
  ensure: 'present'
  vault_uri: 'https://hcv.home.arpa:8200/v1/pki_int/issue/general'
  auth_path: 'cert'
  cert_data:
    ttl: '2160h'  # 90 days
  renewal_threshold: 5
  cert_chain_owner: 'user'
  cert_chain_group: 'user'
  key_owner: 'user'
  key_group: 'user'
  key_mode: '0640'

profile::common::vault_certs:
  docker:
    cert_data:
      common_name: '*.docker.home.arpa'
      alt_names: '*.docker.home.arpa,docker.home.arpa'

profile::common::posix_acls:
  "/opt/docker/traefik/data/certs/docker_key.pem":
    action: set
    permission:
      - "user:101001:r--"
      - "user:101000:r--"
      - "mask::r--"
    subscribe: "Vault_cert[docker]"
  "/opt/docker/paperless-ai/secrets/paperless_token.txt":
    action: set
    permission:
      - "user:110001:r--" # remap base 100000 + app uid 10001
      - "mask::r--"
  "/opt/docker/paperless-ai/secrets/webhook_secret.txt":
    action: set
    permission:
      - "user:110001:r--" # remap base 100000 + app uid 10001
      - "mask::r--"
  "/opt/docker/paperless-ai/secrets/openai_api_key.txt":
    action: set
    permission:
      - "user:110001:r--" # remap base 100000 + app uid 10001
      - "mask::r--"
  "/opt/docker/paperless-ai/secrets/anthropic_api_key.txt":
    action: set
    permission:
      - "user:110001:r--" # remap base 100000 + app uid 10001
      - "mask::r--"
  "/opt/docker/paperless-ai/secrets/google_api_key.txt":
    action: set
    permission:
      - "user:110001:r--" # remap base 100000 + app uid 10001
      - "mask::r--"
  "/opt/docker/paperless-ai/secrets/hf_token.txt":
    action: set
    permission:
      - "user:110001:r--" # remap base 100000 + app uid 10001
      - "mask::r--"
  "/opt/docker/crabberbot/secrets":
    action: set
    permission:
      - "user:165532:--x" # remap base 100000 + cloudflared uid 65532
      - "mask::--x"
  "/opt/docker/crabberbot/secrets/tunnel_token":
    action: set
    permission:
      - "user:165532:r--" # remap base 100000 + cloudflared uid 65532
      - "mask::r--"
  "/opt/docker/rclone/secrets":
    action: set
    permission:
      - "user:165532:--x" # remap base 100000 + cloudflared uid 65532
      - "mask::--x"
  "/opt/docker/rclone/secrets/tunnel_token":
    action: set
    permission:
      - "user:165532:r--" # remap base 100000 + cloudflared uid 65532
      - "mask::r--"
  "/opt/docker/authelia/secrets/authelia_jwt_secret":
    action: set
    permission:
      - "user:101000:r--"
      - "mask::r--"
  "/opt/docker/authelia/secrets/postgres_password":
    action: set
    permission:
      - "user:100070:r--"
      - "mask::r--"
  "/opt/docker/authelia/secrets/ldap_password":
    action: set
    permission:
      - "user:101000:r--"
      - "mask::r--"
  "/opt/docker/authelia/secrets/session_secret":
    action: set
    permission:
      - "user:101000:r--"
      - "mask::r--"
  "/opt/docker/authelia/secrets/storage_encryption_key":
    action: set
    permission:
      - "user:101000:r--"
      - "mask::r--"
  "/opt/docker/send-bills/secrets":
    action: set
    permission:
      - "user:100999:--x" # remap base 100000 + app uid 999
      - "user:100000:--x" # remap base 100000 + container root
      - "mask::--x"
  "/opt/docker/send-bills/secrets/django_secret_key":
    action: set
    permission:
      - "user:100999:r--" # remap base 100000 + app uid 999
      - "mask::r--"
  "/opt/docker/send-bills/secrets/django_email_host_password":
    action: set
    permission:
      - "user:100999:r--" # remap base 100000 + app uid 999
      - "mask::r--"
