---
classes:
  - profile::paperless_scans
  - profile::scratch
  - profile::atlas
  - profile::atlas::certificates
  - profile::vault_sso
  - freeipa_users::provision

nfs_config::server_exports:
  '/scratch':
    clients: '*.home.arpa(sec=krb5p,rw,sync,no_subtree_check,no_root_squash)'
    atboot: true
  '/opt/docker':
    clients: '*.home.arpa(sec=krb5p,rw,sync,no_subtree_check,root_squash)'
    atboot: true

nfs_config::client_mounts:
  '/export/Documents':
    server: aperture.home.arpa
    options_nfsv4: '_netdev,nofail,x-systemd.automount,x-systemd.idle-timeout=10min,x-systemd.mount-timeout=10s,sec=krb5p'

samba::workgroup: 'WORKGROUP'
samba::server_string: 'atlas'
samba::netbios_name: 'ATLAS'
samba::security: 'user'
samba::map_to_guest: 'Bad User'
samba::package_ensure: 'installed'
samba::extra_global_options:
  'ntlm auth': 'ntlmv2-only'
samba::hosts_allow:
  - '10.0.20.189'
  - '10.0.0.'
  - '10.0.40.'
  - 'fd6b:d722:1738:0::/64'
  - 'fd6b:d722:1738:28::/64'
samba::hosts_deny:
  - 'ALL'
samba::shares:
  'shared_pictures':
    comment: 'Shared Pictures'
    path: '/scratch/shared_pictures'
    browseable: true
    writable: true
    force_user: 'user'
    force_group: 'user'
    create_mask: '0660'
    directory_mask: '0770'
    valid_users: ['pictures']
ssh::client_options:
  ProxyCommand: none
  KnownHostsCommand: '/usr/bin/sss_ssh_knownhosts %H'

freeipa::client::hostname: atlas.home.arpa
freeipa::client::ca_cert_file: /usr/local/share/ca-certificates/atlas-infrastructure.crt

profile::common::certs::directories:
  - /opt/docker
  - /opt/docker/traefik/data
  - /opt/docker/traefik/data/certs
  - /opt/docker/airflow/secrets
  - /opt/docker/puppet-control-repo
  - /opt/docker/puppet-control-repo/docker
  - /opt/docker/puppet-control-repo/docker/wolf
  - /opt/docker/puppet-control-repo/docker/wolf/secrets
  - /opt/docker/puppet-control-repo/docker/vault/secrets
  - /opt/docker/puppet-control-repo/docker/freeipa/secrets
  - /opt/docker/browser-use/secrets

profile::docker_host::stack_directories:
  - airflow
  - ais
  - authelia
  - backrest
  - barbero-scripts
  - beszel
  - browser-use
  - camillo
