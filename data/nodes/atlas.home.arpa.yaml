---
ssh::client_options:
  ProxyCommand: none
  KnownHostsCommand: '/usr/bin/sss_ssh_knownhosts %H'

freeipa::client::server: ipa.home.arpa
freeipa::client::hostname: atlas.home.arpa
freeipa::client::ca_cert_file: /usr/local/share/ca-certificates/atlas-infrastructure.crt

profile::common::certs::directories:
  - /opt/docker
  - /opt/docker/traefik/data
  - /opt/docker/traefik/data/certs
  - /opt/docker/airflow/secrets
  - /opt/docker/puppet-control-repo
  - /opt/docker/puppet-control-repo/docker
  - /opt/docker/puppet-control-repo/docker/wolf
  - /opt/docker/puppet-control-repo/docker/wolf/secrets
  - /opt/docker/browser-use/secrets

profile::docker_host::stack_directories:
  - airflow
  - ais
  - authelia
  - backrest
  - barbero-scripts
  - beszel
  - browser-use
  - camillo
  - crabberbot
  - echo-server
  - fcm-service
  - grafana-loki
  - grindr-api-dev-tool
  - iventoy
  - kms
  - monerod
  - open-grind
  - paperless-ai
  - protonmail-bridge
  - qbittorrent
  - rclone
  - rss-to-telegram-bot
  - send-bills
  - shared-inference
  - teamspeak
  - telegram-bot-api
  - tor-i2pd
  - traefik
  - unifi-network-application

profile::common::certs::vault_certs_default_location: /opt/docker/traefik/data/certs
profile::common::certs::vault_certs_defaults:
  vault_uri: 'https://vault.home.arpa:8200/v1/pki_int/issue/puppet-atlas.home.arpa'
  ca_trust: /etc/puppetlabs/puppet/ssl/certs/ca.pem

profile::common::certs::vault_certs:
  atlas:
    cert_data:
      common_name: '*.atlas.home.arpa'
      alt_names: '*.atlas.home.arpa,atlas.home.arpa'
    key_mode: '0640'
  airflow:
    cert_chain_file: /opt/docker/airflow/secrets/fullchain.pem
    cert_chain_owner: 150000
    cert_chain_group: 100000
    cert_chain_mode: '0640'
    key_file: /opt/docker/airflow/secrets/key.pem
    key_owner: 150000
    key_group: 100000
    key_mode: '0600'
  wolf:
    cert_chain_file: /opt/docker/puppet-control-repo/docker/wolf/secrets/fullchain.pem
    cert_chain_owner: 101000
    cert_chain_group: 100000
    cert_chain_mode: '0640'
    key_file: /opt/docker/puppet-control-repo/docker/wolf/secrets/key.pem
    key_owner: 101000
    key_group: 100000
    key_mode: '0600'
  browser-use:
    cert_chain_file: /opt/docker/browser-use/secrets/browser-use.crt
    cert_chain_owner: 101000
    cert_chain_group: 100000
    cert_chain_mode: '0444'
    key_file: /opt/docker/browser-use/secrets/browser-use.key
    key_owner: 101000
    key_group: 100000
    key_mode: '0400'

# Keep the daemon on the same strict parent / system child policy as manual runs.
systemd::dropin_files:
  puppet-crypto.conf:
    unit: puppet.service
    content: |
      [Service]
      Environment=OPENSSL_CONF=/etc/puppetlabs/puppet/openssl.cnf
      ExecStart=
      ExecStart=/opt/puppetlabs/puppet/bin/ruby -r /usr/local/libexec/openvox-child-policy.rb /opt/puppetlabs/puppet/bin/puppet agent $PUPPET_EXTRA_OPTS --no-daemonize
    require: File[/usr/local/libexec/openvox-child-policy.rb]

profile::common::acls::posix_acls:
  "/opt/docker/traefik/data/certs":
    action: set
    permission:
      - "user:101000:r-x"
      - "mask::r-x"
  "/opt/docker/traefik/data/certs/atlas_fullchain.pem":
    action: set
    permission:
      - "user:101000:r--"
      - "mask::r--"
    subscribe: "Vault_cert[atlas]"
  "/opt/docker/traefik/data/certs/atlas_key.pem":
    action: set
    permission:
      - "user:101000:r--"
      - "mask::r--"
    subscribe: "Vault_cert[atlas]"
