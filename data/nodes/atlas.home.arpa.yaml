profile::common::certs::vault_certs_default_location: /opt/docker/traefik/data/certs
profile::common::certs::vault_certs_defaults:
  vault_uri: 'https://vault.home.arpa:8200/v1/pki_int/issue/puppet-atlas.home.arpa'
  ca_trust: /etc/ssl/certs/ca-certificates.crt

profile::common::certs::vault_certs:
  vault-transport:
    vault_uri: 'https://vault.home.arpa:8200/v1/pki_int/issue/vault-transport'
    auth_name: atlas-transport
    cert_data:
      common_name: vault.home.arpa
      alt_names: vault.home.arpa
      ttl: '720h'
    renewal_threshold: 10
    cert_chain_file: /opt/docker/puppet-control-repo/docker/vault/secrets/fullchain.pem
    cert_chain_owner: 100100
    cert_chain_group: 100100
    cert_chain_mode: '0644'
    key_file: /opt/docker/puppet-control-repo/docker/vault/secrets/key.pem
    key_owner: 100100
    key_group: 100100
    key_mode: '0600'
  ipa-transport:
    vault_uri: 'https://vault.home.arpa:8200/v1/pki_freeipa/issue/ipa-transport'
    auth_name: atlas-transport
    cert_data:
      common_name: ipa.home.arpa
      alt_names: ipa.home.arpa
      ttl: '2160h'
    renewal_threshold: 30
    cert_chain_file: /opt/docker/puppet-control-repo/docker/freeipa/secrets/fullchain.pem
    cert_chain_owner: 100000
    cert_chain_group: 100000
    cert_chain_mode: '0644'
    key_file: /opt/docker/puppet-control-repo/docker/freeipa/secrets/key.pem
    key_owner: 100000
    key_group: 100000
    key_mode: '0600'
  atlas:
    cert_data:
      common_name: '*.atlas.home.arpa'
      alt_names: '*.atlas.home.arpa,atlas.home.arpa'
    key_mode: '0640'
  airflow:
    cert_chain_file: /opt/docker/airflow/secrets/fullchain.pem
    cert_chain_owner: 150000
    cert_chain_group: 100000
    cert_chain_mode: '0640'
    key_file: /opt/docker/airflow/secrets/key.pem
    key_owner: 150000
    key_group: 100000
    key_mode: '0600'
  wolf:
    cert_chain_file: /opt/docker/puppet-control-repo/docker/wolf/secrets/fullchain.pem
    cert_chain_owner: 101000
    cert_chain_group: 100000
    cert_chain_mode: '0640'
    key_file: /opt/docker/puppet-control-repo/docker/wolf/secrets/key.pem
    key_owner: 101000
    key_group: 100000
    key_mode: '0600'
  browser-use:
    cert_chain_file: /opt/docker/browser-use/secrets/browser-use.crt
    cert_chain_owner: 101000
    cert_chain_group: 100000
    cert_chain_mode: '0444'
    key_file: /opt/docker/browser-use/secrets/browser-use.key
    key_owner: 101000
    key_group: 100000
    key_mode: '0400'

systemd::dropin_files:
  scratch.conf:
    unit: docker.service
    content: |
      [Unit]
      RequiresMountsFor=/scratch

