profile::common::systemd::units:
  atlas-openvox-renew.service:
    ensure: absent
    enable: false
    active: false
  atlas-openvox-renew.timer:
    ensure: absent
    enable: false
    active: false
  atlas-transport-renew.service:
    ensure: absent
    enable: false
    active: false
  atlas-transport-renew.timer:
    ensure: absent
    enable: false
    active: false
  paperless-snapshot.service:
    content: |
      [Unit]
      Description=Export Paperless data and documents
      Wants=network-online.target docker.service
      After=network-online.target docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      Environment=COMPOSE_ENV_FILES=/opt/docker/.env,/opt/docker/paperless-ai/.env
      ExecStart=/opt/docker/paperless-ai/backup.sh
      TimeoutStartSec=4h
      StandardOutput=journal
      StandardError=journal
    enable: false
    active: false
  paperless-snapshot.timer:
    content: |
      [Unit]
      Description=Schedule weekly Paperless export

      [Timer]
      OnCalendar=Mon *-*-* 01:00:00 UTC
      Persistent=true
      Unit=paperless-snapshot.service

      [Install]
      WantedBy=timers.target
    enable: true
    active: true
    require: Systemd::Unit_file[paperless-snapshot.service]
  paperless-correspondent-cleanup.service:
    content: |
      [Unit]
      Description=Run weekly Paperless correspondent cleanup
      Wants=network-online.target docker.service
      After=network-online.target docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      User=user
      Environment=COMPOSE_ENV_FILES=/opt/docker/.env,/opt/docker/paperless-ai/.env
      WorkingDirectory=/opt/docker/paperless-ai
      ExecStart=/opt/docker/paperless-ai/scripts/correspondent-cleanup weekly
      TimeoutStartSec=2h
      SyslogIdentifier=paperless-correspondent-cleanup
      StandardOutput=journal
      StandardError=journal
    enable: false
    active: false
  paperless-correspondent-cleanup.timer:
    content: |
      [Unit]
      Description=Schedule weekly Paperless correspondent cleanup

      [Timer]
      OnCalendar=Tue *-*-* 01:10:00 UTC
      Persistent=false
      Unit=paperless-correspondent-cleanup.service

      [Install]
      WantedBy=timers.target
    enable: true
    active: true
    require: Systemd::Unit_file[paperless-correspondent-cleanup.service]
  backrest-kinit.service:
    content: |
      [Unit]
      Description=Acquire Backrest Kerberos credentials
      Wants=network-online.target
      After=network-online.target

      [Service]
      Type=oneshot
      ExecStart=/usr/bin/kinit -k -t /etc/krb5-backrest.keytab -c FILE:/tmp/krb5cc_175200010 backrest@HOME.ARPA
      ExecStart=/bin/chown backrest:backrest /tmp/krb5cc_175200010
    enable: false
    active: false
    require: File[/etc/krb5-backrest.keytab]
  backrest-kinit.timer:
    content: |
      [Unit]
      Description=Refresh Backrest Kerberos credentials

      [Timer]
      OnBootSec=1min
      OnUnitActiveSec=12h
      Unit=backrest-kinit.service

      [Install]
      WantedBy=timers.target
    enable: true
    active: true
    require: Systemd::Unit_file[backrest-kinit.service]
  vault-snapshot.service:
    content: |
      [Unit]
      Description=Save a consistent Atlas Vault backup
      Wants=network-online.target
      After=network-online.target docker.service
      Requires=docker.service
      RequiresMountsFor=/scratch

      [Service]
      Type=oneshot
      UMask=0077
      ExecStart=/opt/docker/puppet-control-repo/docker/vault/scripts/backup.sh
      TimeoutStartSec=1h
    enable: false
    active: false
  vault-snapshot.timer:
    content: |
      [Unit]
      Description=Back up Atlas Vault weekly

      [Timer]
      OnCalendar=Mon *-*-* 01:00:00 UTC
      Persistent=true
      Unit=vault-snapshot.service

      [Install]
      WantedBy=timers.target
    enable: true
    active: true
    require: Systemd::Unit_file[vault-snapshot.service]
  automation-exam.service:
    content: |
      [Unit]
      Description=Run exam automation pipeline
      Wants=network-online.target docker.service
      After=network-online.target docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      User=user
      Environment=COMPOSE_ENV_FILES=/opt/docker/.env,/opt/docker/airflow/.env
      WorkingDirectory=/opt/docker/airflow
      ExecStartPre=/usr/bin/docker compose --profile runner up -d --no-build --pull never postgres-outputs
      ExecStart=/usr/bin/docker compose --profile runner run --pull never --rm --no-deps exam
      SyslogIdentifier=automation-exam
      StandardOutput=journal
      StandardError=journal
    enable: false
    active: false
  automation-exam.timer:
    content: |
      [Unit]
      Description=Run exam automation hourly outside quiet hours

      [Timer]
      OnCalendar=*-*-* 00,05..23:00:00 UTC
      Persistent=false
      Unit=automation-exam.service

      [Install]
      WantedBy=timers.target
    enable: true
    active: true
    require: Systemd::Unit_file[automation-exam.service]
  automation-cyber-analyst.service:
    content: |
      [Unit]
      Description=Run monthly cyber analyst pipeline
      Wants=network-online.target docker.service
      After=network-online.target docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      User=user
      Environment=COMPOSE_ENV_FILES=/opt/docker/.env,/opt/docker/airflow/.env
      WorkingDirectory=/opt/docker/airflow
      ExecStartPre=/usr/bin/docker compose --profile runner up -d --no-build --pull never postgres-outputs
      ExecStart=/usr/bin/docker compose --profile runner run --pull never --rm --no-deps cyber-analyst
      SyslogIdentifier=automation-cyber-analyst
      StandardOutput=journal
      StandardError=journal
    enable: false
    active: false
  automation-cyber-analyst.timer:
    content: |
      [Unit]
      Description=Run cyber analyst monthly

      [Timer]
      OnCalendar=*-*-01 03:00:00 UTC
      Persistent=false
      Unit=automation-cyber-analyst.service

      [Install]
      WantedBy=timers.target
    enable: true
    active: true
    require: Systemd::Unit_file[automation-cyber-analyst.service]
  automation-operations-analyst.service:
    content: |
      [Unit]
      Description=Run weekly operations analyst pipeline
      Wants=network-online.target docker.service
      After=network-online.target docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      User=user
      Environment=COMPOSE_ENV_FILES=/opt/docker/.env,/opt/docker/airflow/.env
      WorkingDirectory=/opt/docker/airflow
      ExecStartPre=/usr/bin/docker compose --profile runner up -d --no-build --pull never postgres-outputs
      ExecStart=/usr/bin/docker compose --profile runner run --pull never --rm --no-deps operations-analyst
      SyslogIdentifier=automation-operations-analyst
      StandardOutput=journal
      StandardError=journal
    enable: false
    active: false
  automation-operations-analyst.timer:
    content: |
      [Unit]
      Description=Run operations analyst weekly

      [Timer]
      OnCalendar=Fri *-*-* 02:00:00 UTC
      Persistent=false
      Unit=automation-operations-analyst.service

      [Install]
      WantedBy=timers.target
    enable: false
    active: false
    require: Systemd::Unit_file[automation-operations-analyst.service]
  automation-podcast-statistics.service:
    content: |
      [Unit]
      Description=Run podcast statistics importer
      Wants=network-online.target docker.service
      After=network-online.target docker.service
      Requires=docker.service

      [Service]
      Type=oneshot
      User=user
      Environment=COMPOSE_ENV_FILES=/opt/docker/.env,/opt/docker/airflow/.env
      WorkingDirectory=/opt/docker/airflow
      ExecStartPre=/usr/bin/docker compose --profile runner up -d --no-build --pull never postgres-outputs
      ExecStart=/usr/bin/docker compose --profile runner run --pull never --rm --no-deps podcast-statistics
      SyslogIdentifier=automation-podcast-statistics
      StandardOutput=journal
      StandardError=journal
    enable: false
    active: false
  automation-podcast-statistics.timer:
    content: |
      [Unit]
      Description=Run podcast statistics importer every 15 minutes

      [Timer]
      OnCalendar=*-*-* *:00/15:00 UTC
      Persistent=false
      Unit=automation-podcast-statistics.service

      [Install]
      WantedBy=timers.target
    enable: true
    active: true
    require: Systemd::Unit_file[automation-podcast-statistics.service]

  automation-download-zanzara.service:
    content: |
      [Unit]
      Description=Download archive programme
      Wants=network-online.target docker.service
      After=network-online.target docker.service
      Requires=docker.service
      RequiresMountsFor=/scratch

      [Service]
      Type=oneshot
      User=user
      Environment=COMPOSE_ENV_FILES=/opt/docker/.env,/opt/docker/airflow/.env
      WorkingDirectory=/opt/docker/airflow
      ExecStart=/usr/bin/docker compose --profile runner run --pull never --rm --no-deps download-zanzara
      SyslogIdentifier=automation-download-zanzara
      StandardOutput=journal
      StandardError=journal
    enable: false
    active: false
  automation-download-zanzara.timer:
    content: |
      [Unit]
      Description=Download archive programme daily

      [Timer]
      OnCalendar=*-*-* 00:00:00 UTC
      Persistent=false
      Unit=automation-download-zanzara.service

      [Install]
      WantedBy=timers.target
    enable: true
    active: true
    require: Systemd::Unit_file[automation-download-zanzara.service]

profile::alloy::enable_router_enrichment: true
profile::alloy::router_listen_address: '10.0.0.158'
profile::alloy::loki_url: 'http://127.0.0.1:3100/loki/api/v1/push'

freeipa_users::provision::users:
  backrest:
    first: Backrest
    last: Backup
    keytab: /etc/krb5-backrest.keytab
  ldap_ro:
    first: ldap
    last: ro
  printer:
    first: printer
    last: printer
  airflow:
    first: airflow
    last: airflow
  beszel:
    first: Beszel
    last: Agent
profile::beszel_agent::enable_docker_metrics: true

profile::docker_host::scheduled_refresh: true
profile::docker_host::git_deploy_projects:
  ais:
    build_command: docker compose build --pull
  airflow:
    build_command: docker compose --profile runner build --pull exam download-zanzara
      cyber-analyst operations-analyst podcast-statistics puppet-release-watch
    deploy_command: docker compose up -d --force-recreate --wait --wait-timeout 300 postgres-outputs
  authelia: {}
  backrest: {}
  barbero-scripts: {}
  beszel:
    build_command: docker compose build --pull alerts-init
    deploy_command: docker compose up -d --force-recreate --wait --wait-timeout 300 beszel && docker compose run --rm alerts-init
  browser-use:
    build_command: docker compose build --pull
  crabberbot:
    build_command: YT_DLP_COMMIT_HASH=$(git ls-remote https://github.com/Enucatl/yt-dlp.git
      refs/heads/master | cut -f1) CARGO_PACKAGE_VERSION=$(git describe --long | sed "s/-/./") docker compose build --pull
  grafana-loki: {}
  kms: {}
  paperless-ai:
    build_command: docker compose --profile cleanup build --pull ai webhook-listener
      ai-cleanup cleanup-review
  protonmail-bridge: {}
  qbittorrent: {}
  rclone: {}
  rss-to-telegram-bot: {}
  send-bills:
    build_command: VERSION=$(/home/user/.local/bin/uv run --with setuptools-git-versioning setuptools-git-versioning) &&
      docker compose build --pull --build-arg VERSION="$$VERSION"
  teamspeak: {}
  tor-i2pd: {}
  traefik: {}
  puppet-control-repo:
    branch: production
    run_as: root
    watch_dir: docker
    build_command: docker compose build --pull
    deploy_command: >-
      /usr/bin/flock -w 300 /run/lock/atlas-openvox-maintenance.lock
      docker compose up -d --no-build --pull never --wait --wait-timeout 600
