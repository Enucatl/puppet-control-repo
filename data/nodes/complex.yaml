---
# complex.home.arpa — multi-tenant Wolf/Moonlight cloud gaming server
# node_type: docker  →  inherits data/roles/docker.yaml
#   (profile::docker_host, docker packages, sysctl, cronjobs, alloy, promtail)

nfs_config::server_exports:
  '/opt/docker':
    clients: '*.home.arpa(sec=krb5p,rw,sync,no_subtree_check,root_squash)'
    atboot: true

profile::nvidia_docker::power_limit_watts: 400
profile::nvidia_docker::temp_target_celsius: 80

classes:
  - profile::nvidia_docker

packages::ppas:
  - 'ppa:graphics-drivers/ppa'

packages::sources:
  nvidia-container-toolkit:
    comment: 'NVIDIA Container Toolkit'
    # Flat repo; architecture interpolated from the OS fact (e.g. amd64).
    location: "https://nvidia.github.io/libnvidia-container/stable/deb/%{facts.os.architecture}"
    release: '/'
    key:
      # Retrieve the fingerprint:
      #   curl -fsSL https://nvidia.github.io/libnvidia-container/gpgkey \
      #     | gpg --dry-run --quiet --no-keyring --import --import-options import-show
      id: 'C95B321B61E88C1809C4F759DDCAE044F796ECB0'
      source: 'https://nvidia.github.io/libnvidia-container/gpgkey'

packages::list:
  - libavcodec-dev
  - libavdevice-dev
  - libavfilter-dev
  - libavformat-dev
  - libavutil-dev
  - libsox-dev
  - libswresample-dev
  - libswscale-dev
  - nvidia-container-toolkit
  - nvidia-driver-590-open
  - portaudio19-dev
  - ubuntu-drivers-common


profile::docker_host::git_deploy_projects:
  vllm: {}
  wolf: {}

kmod::list_of_loads:
  'uinput': {}

profile::common::systemd_units:
  vllm-weekly-up.service:
    ensure: absent
  vllm-weekly-up.timer:
    ensure: absent
  vllm-weekly-down.service:
    ensure: absent
  vllm-weekly-down.timer:
    ensure: absent
