---
lookup_options:
  classes:
    merge: unique
  freeipa_users::users:
    merge: hash
  nfs_config::server_exports:
    merge: hash
  nfs_config::client_mounts:
    merge: hash
  packages::list:
    merge: unique
  packages::ppas:
    merge: unique
  packages::sources:
    merge: deep
  profile::common::cronjobs:
    merge: deep
  profile::common::sysctl_settings:
    merge: deep
  profile::common::vault_certs:
    merge: deep
  ssh::client_options:
    merge: deep
  ssh::server_options:
    merge: deep
  systemd::journald_settings:
    merge: deep
  tidy::files:
    merge: deep

classes:
  - systemd
  - ssh
  - nisdomainname
  - fail2ban
  - freeipa
  - freeipa::install::client
  - freeipa_users
  - postfix_configuration
  - profile::alloy
  - profile::common
  - puppet_configuration


nisdomainname::domain: home.arpa

freeipa::install::client::options:
  mkhomedir:
  domain: home.arpa
  server: freeipa.home.arpa
  principal: admin
  password: "%{lookup('freeipa::install::client::options::enrollment-password')}"

fail2ban::config_file_template: 'fail2ban_configuration/jail.conf.epp'
fail2ban::jails:
  ssh: {}
fail2ban::ignoreip:
  - '127.0.0.1/8'
  - '10.0.0.0/24'
fail2ban::bantime: '1h'
fail2ban::maxretry: 5
fail2ban::default_backend: systemd
fail2ban::destemail: 'root@localhost'
fail2ban::sender: 'fail2ban@localhost'
fail2ban::iptables_chain: INPUT
fail2ban::banaction: iptables-multiport
fail2ban::action: action_
fail2ban::sendmail_actions:
  actionstart: ""
  actionstop: ""

postfix::configs:
  smtp_use_tls:
    value: 'yes'
  smtp_sasl_auth_enable:
    value: 'yes'
  smtp_sasl_security_options:
    value: 'noanonymous'
  smtp_sasl_password_maps:
    value: 'hash:/etc/postfix/sasl_passwd'
  smtp_tls_CAfile:
    value: '/etc/ssl/certs/ca-certificates.crt'
  smtp_tls_security_level:
    value: 'encrypt'
  smtp_sasl_mechanism_filter:
    value: 'plain'
  sender_canonical_maps:
    value: 'regexp:/etc/postfix/sender_canonical'
  recipient_canonical_maps:
    value: 'regexp:/etc/postfix/recipient_canonical'
postfix::relayhost: '[smtp.google.com]:587'

puppet_configuration::settings:
  number_of_facts_soft_limit:
    section: agent
    setting: number_of_facts_soft_limit
    value: 10000

ssh::storeconfigs_enabled: true
ssh::validate_sshd_file: true

ssh::server_options:
  HostKey: /etc/ssh/ssh_host_ed25519_key
  Ciphers: chacha20-poly1305@openssh.com
  MACs: hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com,hmac-sha2-512,hmac-sha2-256,umac-128@openssh.com
  ListenAddress:
    - '0.0.0.0'
    - '[::]'
  PasswordAuthentication: no
  PermitEmptyPasswords: no
  PermitRootLogin: no
  MaxAuthTries: 3
  MaxSessions: 11
  X11Forwarding: no
  Subsystem: sftp /usr/lib/openssh/sftp-server
  GSSAPIAuthentication: yes
  GSSAPIKeyExchange: yes
  PubkeyAuthentication: yes
  AuthorizedKeysCommand: /usr/bin/sss_ssh_authorizedkeys
  AuthorizedKeysCommandUser: nobody

ssh::client_options:
  PubkeyAuthentication: yes
  GlobalKnownHostsFile: /var/lib/sss/pubconf/known_hosts
  'Host *':
    Ciphers: chacha20-poly1305@openssh.com
    MACs: hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com,hmac-sha2-512,hmac-sha2-256,umac-128@openssh.com
    HashKnownHosts: yes
    SendEnv: 'LANG LC_*'
    GSSAPIAuthentication: yes
    GSSAPIDelegateCredentials: yes

systemd::journald_settings:
  Storage: auto
  MaxRetentionSec: 1month

systemd::dropin_files:
  alloy_settings.conf:
    unit: "alloy.service"
    content: |
      [Service]
      Environment="GOMEMLIMIT=512MiB"
      Environment="CUSTOM_ARGS=--disable-reporting"
      ExecStart=
      ExecStart=/usr/bin/alloy run --disable-reporting --storage.path=/var/lib/alloy/data $CONFIG_FILE
    notify: "Service[alloy]"

grafana_alloy::manage_package_repo: false

packages::sources:
  grafana-alloy:
    comment: 'Grafana Alloy'
    location: 'https://apt.grafana.com'
    release: 'stable'
    repos: 'main'
    key:
      name: 'grafana-alloy-archive-keyring.asc'
      source: 'https://apt.grafana.com/gpg.key'

tidy::defaults:
  age: 1w
  recurse: true
  rmdirs: true
