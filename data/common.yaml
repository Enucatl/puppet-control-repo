---
lookup_options:
  classes:
    merge: unique
  systemd::journald_settings:
    merge: deep
  tidy::files:
    merge: deep
  packages::list:
    merge: unique

classes:
  - systemd
  - ssh
  - nisdomainname
  - freeipa
  - freeipa::install::client
  - freeipa_users
  - grafana_alloy
  - postfix_configuration
  - puppet_configuration


nisdomainname::domain: home.arpa

freeipa::install::client::options:
  mkhomedir:
  domain: home.arpa
  server: freeipa.home.arpa
  principal: admin
  password: "%{lookup('freeipa::install::client::options::enrollment-password')}"

freeipa_users::user_groups:
  user:
    - docker

fail2ban::sendmail_actions:
  actionstart: ""
  actionstop: ""

grafana_alloy::config: |
  // 1. Output: Remote Loki (Traefik)
  loki.write "remote_loki" {
    endpoint {
      url = "https://loki.docker.home.arpa/loki/api/v1/push"
      
      // MEMORY OPTIMIZATION:
      // Send smaller batches more frequently to clear RAM.
      batch_wait = "1s"      // Default is often higher, send faster
      batch_size = "512KB"   // Default is 1MB+, reduce to keep RAM usage low
    }

    // Ensure the Write Ahead Log (WAL) is managed
    wal {
      enabled = true
      // If the remote endpoint is down, store on disk, don't bloat RAM
      max_segment_age = "1h" 
    }
  }

  // 2. Input: Systemd Journal
  loki.source.journal "read_journal" {
    // If you restart Alloy, 12h might pull too much history at once. 
    // 1h is usually safer for restarts unless you strictly need the backfill.
    max_age = "1h" 
    labels  = {
      job  = "systemd-journal",
      host     = "%{trusted.certname}",
    }
    forward_to = [loki.write.remote_loki.receiver]
  }

  // 3. Input: /var/log Files
  local.file_match "varlogs_files" {
    path_targets = [{
      // Explicitly exclude gzipped files to prevent unzipping in memory
      __path__ = "/var/log/*.log",
      job      = "varlogs",
      host     = "%{trusted.certname}",
    }]
  }

  loki.source.file "varlogs_scrape" {
    targets    = local.file_match.varlogs_files.targets
    forward_to = [loki.write.remote_loki.receiver]
  }

postfix::configs:
  smtp_use_tls:
    value: 'yes'
  smtp_sasl_auth_enable:
    value: 'yes'
  smtp_sasl_security_options:
    value: 'noanonymous'
  smtp_sasl_password_maps:
    value: 'hash:/etc/postfix/sasl_passwd'
  smtp_tls_CAfile:
    value: '/etc/ssl/certs/ca-certificates.crt'
  smtp_tls_security_level:
    value: 'encrypt'
  smtp_sasl_mechanism_filter:
    value: 'plain'
  sender_canonical_maps:
    value: 'regexp:/etc/postfix/sender_canonical'
  recipient_canonical_maps:
    value: 'regexp:/etc/postfix/recipient_canonical'
postfix::relayhost: '[smtp.google.com]:587'

puppet_configuration::settings:
  number_of_facts_soft_limit:
    section: agent
    setting: number_of_facts_soft_limit
    value: 10000

ssh::storeconfigs_enabled: true
ssh::validate_sshd_file: true

ssh::server_options:
  HostKey: /etc/ssh/ssh_host_ed25519_key
  Ciphers: chacha20-poly1305@openssh.com
  MACs: hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com,hmac-sha2-512,hmac-sha2-256,umac-128@openssh.com
  ListenAddress:
    - '0.0.0.0'
    - '[::]'
  PermitEmptyPasswords: no
  PermitRootLogin: no
  MaxAuthTries: 3
  MaxSessions: 11
  X11Forwarding: no
  Subsystem: sftp /usr/lib/openssh/sftp-server
  GSSAPIAuthentication: yes
  GSSAPIKeyExchange: yes
  PubkeyAuthentication: yes
  AuthorizedKeysCommand: /usr/bin/sss_ssh_authorizedkeys
  AuthorizedKeysCommandUser: nobody

ssh::client_options:
  PubkeyAuthentication: yes
  ProxyCommand: '/usr/bin/sss_ssh_knownhostsproxy -p %p %h'
  GlobalKnownHostsFile: /var/lib/sss/pubconf/known_hosts
  'Host *':
    Ciphers: chacha20-poly1305@openssh.com
    MACs: hmac-sha2-512-etm@openssh.com,hmac-sha2-256-etm@openssh.com,umac-128-etm@openssh.com,hmac-sha2-512,hmac-sha2-256,umac-128@openssh.com
    HashKnownHosts: yes
    SendEnv: 'LANG LC_*'
    GSSAPIAuthentication: yes
    GSSAPIDelegateCredentials: yes

systemd::journald_settings:
  Storage: auto
  MaxRetentionSec: 1month

systemd::dropin_files:
  alloy_settings.conf:
    unit: "alloy.service"
    content: |
      [Service]
      Environment="GOMEMLIMIT=512MiB"
      Environment="CUSTOM_ARGS=--disable-reporting"
      ExecStart=
      ExecStart=/usr/bin/alloy run --disable-reporting --storage.path=/var/lib/alloy/data $CONFIG_FILE
    notify: "Service[alloy]"

tidy::defaults:
  age: 1w
  recurse: true
  rmdirs: true

